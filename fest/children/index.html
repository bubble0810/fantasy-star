(()=>{'use strict';const $=s=>document.querySelector(s),game=$('#game'),arena=$('#arena'),q=new URLSearchParams(location.search),trial=q.get('trial')==='1'||q.get('mode')==='trial';const files=['background.jpg','bow.png','arrow-normal.png','ticket.png',...['red','yellow','green','blue','purple','rainbow','mystery'].map(x=>'balloon-'+x+'.png'),...['red','yellow','green','blue','purple','rainbow'].map(x=>'burst-'+x+'.png')];let state='LOADING',rid=0,endAt=0,tickets=0,skill='none',mystery=false,rainbow1=false,rainbow2=false,next=1,active=new Map(),pending=0,spawnAt=0,last=0,raf=0,resultSent=false;const normal=['red','yellow','green','blue','purple'];let ac=null,master=null,dry=null,rev=null,bgmTimer=0,on=true,bgmPlaying=false,bgmStep=0,bgmNext=0,bgmFast=false,noiseBuf=null;

const CHORDS=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66],[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]];

function spawn(kind){if(state!=='PLAYING')return;kind=kind||normal[Math.floor(Math.random()*5)];let el=new Image;el.src='img/balloon-'+kind+'.png';el.className='balloon';let sp=['rainbow','mystery'].includes(kind),size=(sp?155:120)*(.68+Math.random()*.35),b={id:next++,run:rid,kind,el,x:35+Math.random()*(954-size),y:1490+Math.random()*45,size,speed:(sp?410:240)+Math.random()*(sp?145:145),drift:(Math.random()*2-1)*(45+Math.random()*50),phase:Math.random()*6.28,state:'alive',rewarded:false};el.addEventListener('pointerdown',e=>{e.preventDefault();shoot(b,false)});arena.append(el);active.set(b.id,b);render(b);if(kind==='rainbow')sfx('rare');if(kind==='mystery')sfx('mystery')}

function shoot(b,volley){if(b.run!==rid||b.state!=='alive'||(!volley&&state!=='PLAYING'))return;b.state=volley?'volley':'targeted';b.el.classList.add('lock');pending++;sfx('shoot');let ar=new Image;ar.src='img/arrow-normal.png';ar.className='arrow';arena.append(ar);let id=rid,start=performance.now(),dur=volley?330:250;function fly(now){if(id!==rid){ar.remove();return}let gr=game.getBoundingClientRect(),br=b.el.getBoundingClientRect(),bow=$('#bow').getBoundingClientRect(),sx=bow.left-gr.left+bow.width/2,sy=bow.top-gr.top+bow.height*.35,tx=br.left-gr.left+br.width/2,ty=br.top-gr.top+br.height/2,p=Math.min(1,(now-start)/dur),x=sx+(tx-sx)*p,y=sy+(ty-sy)*p,ang=Math.atan2(ty-sy,tx-sx)*180/Math.PI;ar.style.left=x-32+'px';ar.style.top=y-12+'px';ar.style.transform=`rotate(${ang}deg)`;if(p<1)requestAnimationFrame(fly);else{ar.remove();pop(b)}}requestAnimationFrame(fly)}

function volley(){if(state!=='PLAYING'||skill!=='ready')return;state='VOLLEY';skill='used';$('#skill').className='skill used';$('#skillN').textContent='×0';$('#banner').className='banner show';setTimeout(()=>$('#banner').className='banner',1100);let ice=document.createElement('div');ice.className='ice';game.append(ice);sfx('volley');let tar=[...active.values()].filter(b=>b.state==='alive').slice(0,18);if(!tar.length){ice.remove();state=performance.now()<endAt?'PLAYING':'SETTLING';if(state==='SETTLING'&&pending===0)gameOver();return}tar.forEach((b,i)=>setTimeout(()=>{if(b.run===rid)shoot(b,true)},i*28));let w=setInterval(()=>{if(!tar.some(b=>!b.rewarded)){clearInterval(w);ice.remove();state=performance.now()<endAt?'PLAYING':'SETTLING';if(state==='SETTLING'&&pending===0)gameOver()}},30)}
function loop(now,id){if(id!==rid)return;let rem=endAt-now,sec=Math.max(0,Math.ceil(rem/1000));$('#time').textContent=sec+' 秒';if(rem<=0&&state==='PLAYING'){state='SETTLING';stopMusic();for(let b of [...active.values()])if(b.state==='alive'){b.el.remove();active.delete(b.id)}if(pending===0)gameOver()}if(state==='PLAYING'){if(rem<=10000&&!bgmFast){bgmFast=true}let dt=Math.min(.04,(now-last)/1000); last=now; let elapsed=40000-rem;if(!mystery&&elapsed>=12000){mystery=true;spawn('mystery')}if(!rainbow1&&elapsed>=14000){rainbow1=true;spawn('rainbow')}if(!rainbow2&&elapsed>=30000){rainbow2=true;spawn('rainbow')}if(now>=spawnAt){spawn();spawnAt=now+(elapsed<10000?850:elapsed<30000?630:460);if(Math.random()<(elapsed>10000?.18:.08))spawn()}for(let b of [...active.values()])if(b.state==='alive'){b.phase+=dt*2;b.y-=b.speed*dt;b.x=Math.max(10,Math.min(1014-b.size,b.x+Math.sin(b.phase)*b.drift*dt*.08));render(b);if(b.y<-260){b.el.remove();active.delete(b.id)}}}if(['PLAYING','VOLLEY','SETTLING'].includes(state))raf=requestAnimationFrame(t=>loop(t,id))}
function gameOver(){if(resultSent)return;resultSent=true;state='RESULT';stopMusic();sfx('end');const collected=tickets;tickets+=8;$('#final').textContent=tickets;$('#trialNote').textContent=`射擊所得 ${collected} 張＋完成獎勵 8 張${trial?'（體驗不發獎）':''}`;$('#result').classList.remove('hidden');fsReport(tickets)}function leave(){FSGame.close()}
$('#go').onclick=()=>{$('#intro').classList.add('hidden');begin()};$('#again').onclick=begin;$('#skill').onclick=volley;$('#exit').onclick=()=>{if(state==='PLAYING'){$('#quit').classList.remove('hidden');state='QUIT'}};$('#stay').onclick=()=>{$('#quit').classList.add('hidden');state='PLAYING'};$('#leave').onclick=leave;$('#out').onclick=leave;$('#sound').onclick=()=>{on=!on;$('#sound').textContent=on?'🔊':'🔇';if(on){audio();if(state==='PLAYING')music(bgmFast)}else stopMusic()};preload()})();
</script></body></html>

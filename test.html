<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>雲端連線測試</title>
<style>
:root{--bg:#f4ecfb;--ink:#3b2853;--ok:#1f9d55;--no:#c2185b;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1726;--ink:#eee;--card:#2a2235}}
:root[data-theme="dark"]{--bg:#1d1726;--ink:#eee;--card:#2a2235}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;margin:0;padding:24px 16px}
.box{max-width:520px;margin:0 auto;background:var(--card);border-radius:18px;padding:20px;box-shadow:0 8px 24px -12px #0004}
h1{font-size:1.3rem;margin:0 0 4px}p{margin:0 0 14px;font-size:.9rem;opacity:.8}
li{margin:8px 0;list-style:none;font-size:1rem}ul{padding:0}
.ok{color:var(--ok)}.no{color:var(--no)}small{display:block;opacity:.75;font-size:.78rem;word-break:break-all}
#final{margin-top:14px;padding:12px;border-radius:12px;font-weight:700;text-align:center;background:#0000000d}
</style>
<div class="box"><h1>幻想智慧星・雲端連線測試</h1><p>打開這頁會自動測試能不能連到 Firebase。等 10 秒左右，把結果截圖給 Claude。</p>
<ul id="list"></ul><div id="final">測試中…</div></div>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
const L=document.getElementById('list'),F=document.getElementById('final');
const step=(t,ok,d)=>{const li=document.createElement('li');li.innerHTML=`<span class="${ok?'ok':'no'}">${ok?'✅':'❌'}</span> ${t}${d?`<small>${String(d).replace(/</g,'&lt;')}</small>`:''}`;L.appendChild(li)};
(async()=>{
  if(typeof firebase==='undefined'){step('1. 載入 Firebase 程式',false,'無法從 cdn.jsdelivr.net 載入');F.textContent='❌ 失敗：程式載入不了';return}
  step('1. 載入 Firebase 程式',true);
  try{firebase.initializeApp({apiKey:"AIzaSyCdIKLj_pLIMpLIFicH82REBqffA99l8oQ",authDomain:"fantasystar-game.firebaseapp.com",projectId:"fantasystar-game",storageBucket:"fantasystar-game.firebasestorage.app",messagingSenderId:"951490146041",appId:"1:951490146041:web:85d7745d295eba4ec87c28"})}catch(e){step('2. 初始化',false,e.message);return}
  let uid;try{const r=await Promise.race([firebase.auth().signInAnonymously(),new Promise((_,j)=>setTimeout(()=>j(new Error('逾時 15 秒')),15000))]);uid=r.user.uid;step('2. 匿名登入',true,'uid: '+uid.slice(0,8)+'…')}catch(e){step('2. 匿名登入',false,(e.code||'')+' '+e.message);F.textContent='❌ 失敗：登入不了';return}
  const db=firebase.firestore(),code='TEST'+Math.random().toString(36).slice(2,10).toUpperCase();
  try{await Promise.race([db.collection('saves').doc(code).set({uids:[uid],t:firebase.firestore.FieldValue.serverTimestamp(),v:1,data:'test'}),new Promise((_,j)=>setTimeout(()=>j(new Error('逾時 15 秒')),15000))]);step('3. 寫入雲端存檔',true,'代碼 '+code)}catch(e){step('3. 寫入雲端存檔',false,(e.code||'')+' '+e.message);F.textContent='❌ 失敗：存不進去';return}
  try{const s=await db.collection('saves').doc(code).get();step('4. 讀回雲端存檔',s.exists&&s.data().data==='test')}catch(e){step('4. 讀回雲端存檔',false,(e.code||'')+' '+e.message);F.textContent='❌ 失敗：讀不回來';return}
  try{await db.collection('saves').doc(code).update({data:'spam',t:firebase.firestore.FieldValue.serverTimestamp()});step('5. 防狂按存檔',false,'20 秒內第二次存檔竟然成功了，規則可能沒發布')}catch(e){step('5. 防狂按存檔（20 秒內第二次被擋下）',true)}
  try{await db.collection('saves').get();step('6. 防偷看全部玩家',false,'竟然能列出所有存檔')}catch(e){step('6. 防偷看全部玩家（被擋下）',true)}
  F.textContent=L.querySelectorAll('.no').length?'⚠️ 部分項目要調整':'🎉 全部成功！雲端存檔可以使用';
})();
</script>
</body></html>

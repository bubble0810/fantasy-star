<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>萬聖節找小幽靈</title>
<script src="../common.js"></script><link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--ink:#3b2853;--muted:#6b5b7d;--rose:#e2508f;--orange:#c8580f;--purple:#5b3a9a;--line:#e5d8f2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1e1536;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
.disp{font-family:Huninn,"Noto Sans TC",sans-serif;font-weight:400}
.app{max-width:560px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:100vh}
.hud{position:absolute;z-index:50;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:start;gap:8px;pointer-events:none}
.chip{background:#ffffffeb;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.chip svg{width:18px;height:18px}
.hudR{display:flex;gap:6px;align-items:center;justify-self:end}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:#ffffffeb;color:var(--ink);font-size:16px;font-weight:700;cursor:pointer}
.scene{position:relative;width:min(100%,calc((100vh - 140px)*2/3));margin:0 auto;aspect-ratio:2/3;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #0008;background:#2a1d4a;touch-action:manipulation}
.scene>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ghost{position:absolute;width:9%;aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;transform:translate(-50%,-50%);transition:opacity .4s,filter .4s}
.ghost::before{content:"";position:absolute;inset:-35%}          /* 點擊範圍比圖案大 */
.ghost img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 0 4px #ffffff55);animation:bob 2.4s ease-in-out infinite}
.ghost.l1{width:17%}
.ghost.l2{width:11%}
.ghost.l3{width:15%}
.tip{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#c8580f;font-weight:700;font-size:clamp(12px,2.4vw,16px);padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px #0005;animation:tipbob 1s ease-in-out infinite}
.tip::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes tipbob{0%,100%{margin-top:-4px}50%{margin-top:-10px}}
.spot{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:none;border-radius:50%;cursor:pointer;padding:0}
.spot.teach{box-shadow:0 0 0 2px #ffffffcc;background:#ffffff22;animation:teach 1.6s ease-in-out}
@keyframes teach{0%,100%{opacity:0}30%,70%{opacity:1}}
.spot.searched{pointer-events:none}
.empty{position:absolute;pointer-events:none;transform:translate(-50%,-50%);color:#e8e0f5;font-size:clamp(13px,2.4vw,18px);text-shadow:0 2px 0 #0008;white-space:nowrap}
.puff{position:absolute;width:1.4%;aspect-ratio:1;border-radius:50%;background:#fff;pointer-events:none;opacity:.85}
.ghost.reveal img{animation:none}
.ghost.gold img{filter:drop-shadow(0 0 8px #ffe27a)}
.ghost.found{pointer-events:none;animation:popout .45s ease-out forwards}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes popout{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.4);opacity:1}100%{transform:translate(-50%,-50%) scale(.2);opacity:0}}
.pt{position:absolute;pointer-events:none;width:7%;aspect-ratio:1;transform:translate(-50%,-50%)}
.pt svg{width:100%;height:100%}
.plus{position:absolute;pointer-events:none;transform:translate(-50%,-50%);color:#ffe27a;font-size:clamp(18px,3.4vw,28px);text-shadow:0 2px 0 #0007,0 0 10px #000a;white-space:nowrap}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dots{display:flex;gap:6px}
.dots i{width:30px;height:30px;border-radius:50%;background:#ffffff22;border:2px dashed #ffffff55;display:flex;align-items:center;justify-content:center}
.dots i.on{background:#ffffffee;border:2px solid #fff}
.dots i img{width:24px;height:24px;object-fit:contain;opacity:0}
.dots i.on img{opacity:1}
.lvtitle{color:#fff;font-size:15px}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#120c22cc;z-index:10;overflow-y:auto}
.panel[hidden]{display:none}
.card{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px #0006}
.card h1{margin:0;text-align:center;color:var(--orange);font-size:28px}
.card h2{margin:0;font-size:15px}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.tag{align-self:center;background:#fde8d6;color:var(--orange);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvls div{border-radius:12px;overflow:hidden;background:#f4ecfb;font-size:12px;text-align:center;padding-bottom:4px}
.lvls img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;margin-bottom:3px}
.lvls b{display:block;font-size:13px}
.go{height:54px;border:0;border-radius:999px;background:var(--rose);color:#fff;font-size:21px;cursor:pointer}
.sub{height:44px;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.total{display:flex;justify-content:space-around;text-align:center;background:#fff4e6;border-radius:14px;padding:10px}
.total div{display:flex;flex-direction:column}
.total span{font-size:12px;color:var(--muted)}
.total b{font-size:26px;color:var(--orange)}
.row{display:flex;gap:8px}.row>*{flex:1}
.note{font-size:11px!important;color:#8a7a9c!important;text-align:center}
.lvcard img{display:block;margin:0 auto;width:min(100%,260px);aspect-ratio:2/3;object-fit:cover;border-radius:14px}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="chip disp" id="lvChip" style="grid-column:2">第 1 關</div>
    <div class="hudR" style="grid-column:3">
      <div class="chip"><span id="candySvg"></span><span id="cTotal">0</span></div>
      <div class="chip disp" id="timeChip">0 秒</div>
      <button class="icon" id="musBtn" aria-label="音樂開關">♪</button>
    </div>
  </div>
  <div class="scene" id="scene"><img class="bg" id="bg" src="img/scene1.webp" alt="萬聖節場景"></div>
  <div class="bar">
    <div>
      <div class="lvtitle disp" id="lvName">南瓜田</div>
      <div class="dots" id="dots"></div>
    </div>
  </div>
</div>

<!-- 開始畫面 -->
<div class="panel" id="startP">
  <div class="card">
    <span class="tag">試玩版・只有你看得到</span>
    <h1 class="disp">萬聖節找小幽靈</h1>
    <p>三關限時依序為 <b>10 秒、10 秒、20 秒</b>。每關找齊 <b>5 隻普通小幽靈</b>或時間到，就自動換關；第三關完成後結算，剩餘秒數不帶到下一關。普通小幽靈給 <b>1～5 顆萬聖糖果</b>，金色小幽靈給 10 顆、不列入過關條件，想拿獎勵要先點牠！第三關注意冒煙與沙沙聲，找出藏起來的小幽靈。</p>
    <div class="lvls">
      <div><img src="img/scene1.webp" alt=""><b>第 1 關</b>南瓜田<br>10 秒・看到就點</div>
      <div><img src="img/scene2.webp" alt=""><b>第 2 關</b>鬼屋書房<br>10 秒・變小、會飄動</div>
      <div><img src="img/scene3.webp" alt=""><b>第 3 關</b>月光墓園<br>20 秒・躲在東西後面</div>
    </div>
    <button class="go disp" id="goBtn">出發！</button>
    <p class="note">有背景音樂，右上角 ♪ 可以關掉。</p>
  </div>
</div>

<!-- 關卡轉場 -->
<div class="panel" id="lvP" hidden>
  <div class="card lvcard">
    <h1 class="disp" id="lvpTitle">第 2 關</h1>
    <img id="lvpImg" src="img/scene2.webp" alt="">
    <p id="lvpText" style="text-align:center;font-size:15px"></p>
    <button class="go disp" id="lvpGo">開始找！</button>
  </div>
</div>

<!-- 結算 -->
<div class="panel" id="resP" hidden>
  <div class="card">
    <h1 class="disp">夜巡完成！</h1>
    <div class="total">
      <div><span>這一輪拿到萬聖糖果</span><b class="disp" id="rCandy">0</b></div>
      <div><span>總共花了</span><b class="disp" id="rTime">0</b></div>
    </div>
    <p id="rLine" style="text-align:center"></p>
    <p id="rPace" style="text-align:center"></p>
    <button class="go disp" id="againBtn">再玩一輪</button>
    <button class="sub" id="homeBtn">回到開始畫面</button>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const scene=$('scene');
/* ---------- 設定 ---------- */
const LEVELS=[
  {name:'南瓜田',img:'img/scene1.webp',cls:'l1',text:'練習關！看到小幽靈就點下去。'},
  {name:'鬼屋書房',img:'img/scene2.webp',cls:'l2',text:'小幽靈變小了，還會飄來飄去、轉過身！抓準時機點下去。'},
  {name:'月光墓園',img:'img/scene3.webp',cls:'l3',text:'小幽靈躲起來了！點點看南瓜、墓碑、長椅、雕像……有的地方是空的，再找別的地方吧！聽到沙沙聲、看到冒煙的地方要特別注意喔。'}];
// 第 3 關可以點的躲藏點（x%, y%, 大小%）—— 依月光墓園圖片位置
const SPOTS3=[[13,24,15],[44,27,13],[78,30,13],[12,38,11],[45,42,11],[33,44,10],[74,47,11],[86,41,13],[15,57,17],[40,65,14],[83,62,15],[22,69,12],[90,72,11],[39,76,9],[30,84,16]];
const PER_LEVEL=5, GOLD_CHANCE=0.6, GOLD_CANDY=10;
const PRICE={look:240,room:300}, RUNS_PER_DAY=3;
const FRONT=['00','01','02','10','11','12','20','21','22'], BACK=['30','31','32'];

/* ---------- 糖果圖示（程式畫） ---------- */
const CANDY=[
 c=>`<svg viewBox="0 0 40 40"><rect x="18.5" y="20" width="3" height="18" rx="1.5" fill="#f3e3c3"/><circle cx="20" cy="15" r="12" fill="${c}"/><path d="M20 15m-8 0a8 8 0 1 0 8-8a5 5 0 1 1-5 5a3 3 0 1 0 3-3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>`,
 c=>`<svg viewBox="0 0 40 40"><path d="M4 12l8 8-8 8zM36 12l-8 8 8 8z" fill="${c}"/><ellipse cx="20" cy="20" rx="10" ry="8" fill="${c}"/><path d="M14 16q6 8 12 0" stroke="#fff" stroke-width="2" fill="none" opacity=".8"/></svg>`,
 ()=>`<svg viewBox="0 0 40 40"><path d="M20 3L36 35Q20 39 4 35z" fill="#ffffff"/><path d="M12.5 20L27.5 20L36 35Q20 39 4 35z" fill="#ff9a1f"/><path d="M8 28L32 28L36 35Q20 39 4 35z" fill="#ffd23a"/></svg>`];
const CANDY_COLORS=['#ff7a1a','#8a4fd1','#3fb36a','#e2508f'];
const candyIcon=()=>CANDY[1]('#ff7a1a');
$('candySvg').innerHTML=candyIcon();

/* ---------- 遊戲狀態 ---------- */
let R=null;   // 一輪
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const LEVEL_TIMES=[10,10,20];
function newRound(){
  R={lv:0,candy:0,found:0,gold:0,goldLv:Math.random()<GOLD_CHANCE?rint(0,2):-1,t:0,levelT:0,ghosts:[],running:false};
  $('cTotal').textContent='0';
}
function placePoints(n){
  const pts=[];let tries=0;
  while(pts.length<n&&tries<800){tries++;
    const p={x:rnd(8,92),y:rnd(25,88)};
    if(pts.every(q=>Math.hypot(q.x-p.x,(q.y-p.y)*1.5)>20))pts.push(p);}
  while(pts.length<n)pts.push({x:rnd(8,92),y:rnd(25,88)});
  return pts;
}
function rnd(a,b){return a+Math.random()*(b-a)}
function buildLevel(){
  const L=LEVELS[R.lv];
  scene.querySelectorAll('.ghost,.pt,.plus,.spot,.tip,.empty,.puff').forEach(e=>e.remove());
  $('bg').src=L.img;$('lvChip').textContent=`第 ${R.lv+1} 關 / 3`;$('lvName').textContent=L.name;
  const hasGold=R.goldLv===R.lv;
  $('dots').innerHTML=Array.from({length:PER_LEVEL},()=>`<i><img src="img/g_w00.webp" alt=""></i>`).join('');
  R.levelFound=0;R.levelT=0;R.levelStart=performance.now();$('timeChip').textContent=LEVEL_TIMES[R.lv]+' 秒';R.rustle=2.5;
  MUSIC.tempo(R.lv===2?112:R.lv===1?124:116);
  if(L.cls==='l3'){buildHide(hasGold);return}
  const pts=placePoints(PER_LEVEL+(hasGold?1:0));
  R.ghosts=pts.map((p,i)=>{
    const gold=hasGold&&i===PER_LEVEL, f=pick(FRONT);
    const b=document.createElement('button');
    b.className='ghost '+L.cls+(gold?' gold':'');b.setAttribute('aria-label',gold?'金色小幽靈':'小幽靈');
    b.innerHTML=`<img src="img/g_${gold?'g':'w'}${f}.webp" alt="">`;
    b.style.left=p.x+'%';b.style.top=p.y+'%';
    const g={el:b,gold,front:f,back:pick(BACK),bx:p.x,by:p.y,x:p.x,y:p.y,
      ax:rnd(5,9),ay:rnd(3,6),wx:rnd(.25,.45),wy:rnd(.3,.55),ph:rnd(0,6.28),ph2:rnd(0,6.28),turnAt:rnd(2,5),turned:false,found:false};
    b.addEventListener('click',e=>{e.stopPropagation();catchGhost(g)});
    scene.appendChild(b);return g;
  });
  if(L.cls==='l1'){const g=R.ghosts.find(x=>!x.gold);const t=document.createElement('div');t.className='tip';t.id='tip';t.textContent='點我！';
    t.style.left=g.x+'%';t.style.top=(g.y-7)+'%';scene.appendChild(t)}
}
/* 第 3 關：小幽靈躲在東西後面 */
function buildHide(hasGold){
  const order=shuffle(SPOTS3.map((s,i)=>i));
  const n=PER_LEVEL+(hasGold?1:0),hide=new Set(order.slice(0,n));
  R.ghosts=[];
  SPOTS3.forEach(([x,y,w],i)=>{
    const b=document.createElement('button');b.className='spot teach';b.style.left=x+'%';b.style.top=Math.max(25,y)+'%';b.style.width=w+'%';
    b.setAttribute('aria-label','找找看這裡');
    let g=null;
    if(hide.has(i)){g={spot:b,gold:hasGold&&order.indexOf(i)===n-1,front:pick(FRONT),x,y,found:false,el:null};R.ghosts.push(g)}
    b.addEventListener('click',e=>{e.stopPropagation();if(!R.running||b.classList.contains('searched'))return;
      b.classList.add('searched');b.classList.remove('teach');R.searched=(R.searched||0)+1;
      if(g){ // 跳出小幽靈
        const gb=document.createElement('button');gb.className='ghost l3 reveal'+(g.gold?' gold':'');gb.innerHTML=`<img src="img/g_${g.gold?'g':'w'}${g.front}.webp" alt="">`;
        gb.style.left=x+'%';gb.style.top=(y-4)+'%';scene.appendChild(gb);g.el=gb;g.y=y-4;
        gb.animate([{transform:'translate(-50%,-10%) scale(.2)',opacity:0},{transform:'translate(-50%,-70%) scale(1.15)',opacity:1}],{duration:320,easing:'ease-out',fill:'forwards'});
        sfx('boo');const run=R,lv=R.lv;setTimeout(()=>{if(R===run&&R.lv===lv)catchGhost(g)},420);
      }else{ // 空的
        const t=document.createElement('div');t.className='empty disp';t.textContent=pick(['空的～','沒有耶','不在這裡']);t.style.left=x+'%';t.style.top=y+'%';scene.appendChild(t);
        t.animate([{opacity:0,transform:'translate(-50%,-30%)'},{opacity:1,transform:'translate(-50%,-80%)',offset:.3},{opacity:0,transform:'translate(-50%,-140%)'}],{duration:900}).onfinish=()=>t.remove();
        sfx('empty');
      }});
    scene.appendChild(b);
  });
  setTimeout(()=>scene.querySelectorAll('.spot.teach').forEach(b=>b.classList.remove('teach')),1700);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* 有小幽靈的地方偶爾冒出一點煙 */
function rustle(){
  const left=R.ghosts.filter(g=>!g.found&&!g.spot.classList.contains('searched'));if(!left.length)return;
  const g=pick(left);sfx('rustle');
  for(let i=0;i<5;i++){const p=document.createElement('div');p.className='puff';p.style.left=(g.x+rnd(-2,2))+'%';p.style.top=(g.y+rnd(-2,2))+'%';scene.appendChild(p);
    p.animate([{transform:'scale(.4)',opacity:.9},{transform:`translate(${rnd(-20,20)}px,${rnd(-30,-12)}px) scale(1.4)`,opacity:0}],{duration:900,delay:i*60}).onfinish=()=>p.remove()}
}
function catchGhost(g){
  if(g.found||!R.running||(performance.now()-R.levelStart)/1000>=LEVEL_TIMES[R.lv])return;
  g.found=true;if(!g.gold)R.found++;g.el.classList.add('found');const tip=$('tip');if(tip)tip.remove();
  const n=g.gold?GOLD_CANDY:rint(1,5);
  R.candy+=n;$('cTotal').textContent=R.candy;
  burst(g.x,g.y,n,g.gold);
  if(g.gold){R.gold++;sfx('gold')}else{R.levelFound++;sfx('pop');
    const d=$('dots').children[R.levelFound-1];if(d){d.classList.add('on');d.querySelector('img').src=g.el.querySelector('img').src}}
  setTimeout(()=>g.el.remove(),500);
  if(R.levelFound>=PER_LEVEL){
    R.t+=Math.min(LEVEL_TIMES[R.lv],(performance.now()-R.levelStart)/1000);
    levelDone();
  }
}
/* 噴出糖果和星星 */
function burst(x,y,n,gold){
  const plus=document.createElement('div');plus.className='plus disp';plus.textContent=(gold?'金色小幽靈！ ':'')+'+'+n;
  plus.style.left=x+'%';plus.style.top=y+'%';scene.appendChild(plus);
  plus.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{transform:'translate(-50%,-140%) scale(1.1)',opacity:1,offset:.3},{transform:'translate(-50%,-260%) scale(1)',opacity:0}],{duration:1100,easing:'ease-out'}).onfinish=()=>plus.remove();
  const count=Math.min(10,n+3);
  for(let i=0;i<count;i++){
    const p=document.createElement('div');p.className='pt';
    const star=i>=n;   // 多出來的是星星
    p.innerHTML=star?`<svg viewBox="0 0 40 40"><path d="M20 2l5 12 13 1-10 8 3 13-11-7-11 7 3-13-10-8 13-1z" fill="${gold?'#ffd23a':'#fff6b0'}"/></svg>`:CANDY[i%3](pick(CANDY_COLORS));
    p.style.left=x+'%';p.style.top=y+'%';scene.appendChild(p);
    const ang=rnd(-Math.PI*0.95,-Math.PI*0.05),dist=rnd(40,110),dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist;
    p.animate([{transform:'translate(-50%,-50%) scale(.3) rotate(0)',opacity:1},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1) rotate(${rnd(-200,200)}deg)`,opacity:1,offset:.55},
      {transform:`translate(calc(-50% + ${dx*1.15}px),calc(-50% + ${dy+60}px)) scale(.8) rotate(${rnd(-300,300)}deg)`,opacity:0}],
      {duration:rnd(800,1200),easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>p.remove();
  }
}
function levelDone(){
  sfx('clear');
  if(R.lv<2){R.lv++;buildLevel();R.running=true;}else endRound();
}
function endRound(){
  R.running=false;$('timeChip').textContent='0 秒';MUSIC.stop();sfx('end');
  $('rCandy').textContent=R.candy;$('rTime').textContent=Math.round(R.t)+' 秒';
  $('rLine').textContent=`找到小幽靈 ${R.found} 隻（第 3 關翻了 ${R.searched||0} 個地方）`+(R.goldLv>=0?`・金色小幽靈 ${R.gold ? '找到了！' : '這次沒找到'}`:'・這一輪沒有金色小幽靈');
  const all=PRICE.look+PRICE.room;
  $('rPace').innerHTML=`照這一輪的速度，換齊萬聖造型＋小屋（${all} 顆）大約要 <b>${Math.ceil(all/R.candy)} 輪</b>，每天 ${RUNS_PER_DAY} 輪約 <b>${Math.ceil(all/R.candy/RUNS_PER_DAY)} 天</b>`;
  show('resP');
  if(window.FS_EMBED){fsReport(R.candy);fsResult('againBtn','homeBtn')}
}

/* ---------- 每一格畫面更新：計時、第 3 關飄動 ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(R&&R.running){
    R.levelT=(ts-R.levelStart)/1000;
    while(R.running&&R.levelT>=LEVEL_TIMES[R.lv]){
      const elapsed=R.levelT-LEVEL_TIMES[R.lv];
      R.t+=LEVEL_TIMES[R.lv];levelDone();
      if(R.running){R.levelStart=ts-elapsed*1000;R.levelT=elapsed;}
    }
    if(!R.running){requestAnimationFrame(loop);return}
    $('timeChip').textContent=Math.max(0,Math.ceil(LEVEL_TIMES[R.lv]-R.levelT))+' 秒';
    if(LEVELS[R.lv].cls==='l3'){R.rustle-=dt;if(R.rustle<=0){R.rustle=rnd(3.5,5.5);rustle()}}
    if(LEVELS[R.lv].cls==='l2'){
      for(const g of R.ghosts){if(g.found)continue;
        g.x=Math.max(6,Math.min(94,g.bx+g.ax*Math.sin(R.levelT*g.wx+g.ph)));
        g.y=Math.max(12,Math.min(90,g.by+g.ay*Math.sin(R.levelT*g.wy+g.ph2)));
        g.el.style.left=g.x+'%';g.el.style.top=g.y+'%';
        g.turnAt-=dt;
        if(g.turnAt<=0){g.turned=!g.turned;g.turnAt=g.turned?rnd(1.2,2):rnd(2.5,5);
          g.el.querySelector('img').src=`img/g_${g.gold?'g':'w'}${g.turned?g.back:g.front}.webp`;
          g.el.style.opacity=g.turned?.45:1;}
      }
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 畫面切換 ---------- */
function show(id){['startP','lvP','resP'].forEach(p=>$(p).hidden=p!==id)}
function startRound(){newRound();buildLevel();show(null);R.running=true;MUSIC.start();sfx('go')}
$('goBtn').addEventListener('click',startRound);
$('againBtn').addEventListener('click',startRound);
$('homeBtn').addEventListener('click',()=>{R=null;show('startP')});
$('lvpGo').addEventListener('click',()=>{buildLevel();show(null);R.running=true;});
$('musBtn').addEventListener('click',()=>{const o=MUSIC.toggle();$('musBtn').style.opacity=o?1:.45;if(o&&R&&R.running)MUSIC.start()});

/* ---------- 萬聖節配樂（程式即時產生，原創旋律） ---------- */
const MUSIC=(()=>{
  let ac=null,out=null,dry=null,rev=null,on=true,playing=false,timer=0,nextT=0,step=0,SD=60/116/2;
  const mid=n=>440*Math.pow(2,(n-69)/12);
  // A 小調，以 A4(69) 為 0
  const MEL=[
   [12,null,7,null,3,7,12,null],[8,null,12,null,15,'-',12,null],[5,8,12,8,5,null,3,null],[11,'-',7,'-',2,null,null,null],
   [12,null,14,null,15,null,12,null],[8,12,15,12,8,null,7,null],[11,null,14,null,19,'-',11,null],[12,'-','-',null,0,null,null,null],
   [15,null,15,14,12,null,10,null],[14,'-',10,null,7,null,null,null],[12,null,15,null,19,'-',15,null],[14,'-',11,null,7,null,null,null],
   [8,null,12,null,15,null,17,null],[19,'-',17,null,14,null,10,null],[11,null,14,null,19,null,14,11],[12,'-','-','-',null,null,null,null]];
  const Am=[0,3,7],F=[-4,0,3],Dm=[5,8,12],E=[7,11,14],C=[3,7,10],G=[-2,2,5];
  const CH=[Am,F,Dm,E,Am,F,E,Am, C,G,Am,E,F,G,E,Am];
  function init(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(FSGame.output(ac));
    out=ac.createGain();out.gain.value=.55;out.connect(comp);dry=ac.createGain();dry.connect(out);
    rev=ac.createConvolver();const len=ac.sampleRate*2,ir=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5)}
    rev.buffer=ir;const rg=ac.createGain();rg.gain.value=.3;rev.connect(rg).connect(out)}
  function bus(p){const s=ac.createStereoPanner?ac.createStereoPanner():ac.createGain();if(s.pan)s.pan.value=p||0;s.connect(dry);s.connect(rev);return s}
  function env(g,t,a,pk,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
  // 撥弦（像小提琴撥奏）
  function pizz(n,t,v,p){const o=bus(p),a=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();a.type='triangle';a.frequency.value=mid(n);
    f.type='lowpass';f.frequency.setValueAtTime(3200,t);f.frequency.exponentialRampToValueAtTime(500,t+.25);a.connect(f).connect(g).connect(o);env(g,t,.004,v,.28);a.start(t);a.stop(t+.35)}
  // 鋼片琴（輕亮的鐘聲）
  function celesta(n,t,v,p){const o=bus(p),c=ac.createOscillator(),m=ac.createOscillator(),mg=ac.createGain(),g=ac.createGain();
    c.frequency.value=mid(n);m.frequency.value=mid(n)*2;mg.gain.setValueAtTime(mid(n)*1.2,t);mg.gain.exponentialRampToValueAtTime(1,t+.8);
    m.connect(mg).connect(c.frequency);c.connect(g).connect(o);env(g,t,.003,v,.9);c.start(t);m.start(t);c.stop(t+1);m.stop(t+1)}
  function bass(n,t,v){const o=bus(0),a=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();a.type='square';a.frequency.value=mid(n);
    f.type='lowpass';f.frequency.value=420;a.connect(f).connect(g).connect(o);env(g,t,.005,v,.22);a.start(t);a.stop(t+.3)}
  let nb=null;function noise(t,d,v,fq,q,p){if(!nb){nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const x=nb.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1}
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),o=bus(p);s.buffer=nb;f.type='bandpass';f.frequency.value=fq;f.Q.value=q;s.connect(f).connect(g).connect(o);env(g,t,.002,v,d);s.start(t,Math.random()*.5);s.stop(t+d+.05)}
  function block(t,v,hi){const o=bus(hi?.35:-.35),a=ac.createOscillator(),g=ac.createGain();a.type='sine';a.frequency.value=hi?1250:880;a.connect(g).connect(o);env(g,t,.001,v,.06);a.start(t);a.stop(t+.1)}
  function kick(t,v){const o=bus(0),a=ac.createOscillator(),g=ac.createGain();a.frequency.setValueAtTime(120,t);a.frequency.exponentialRampToValueAtTime(40,t+.12);a.connect(g).connect(o);env(g,t,.002,v,.16);a.start(t);a.stop(t+.22)}
  function tick(){while(nextT<ac.currentTime+.15){
    const bar=Math.floor(step/8)%16,s=step%8,t=nextT,ch=CH[bar],m=MEL[bar][s];
    if(typeof m==='number'){pizz(69+m,t,.2,.1);if(s%4===0)celesta(81+m,t,.05,-.2)}
    if(s===1||s===5)celesta(69+ch[[1,2][s===1?0:1]]+12,t,.035,.4);
    if(s===0||s===4)bass(45+ch[0]-(ch[0]>6?12:0),t,.16);
    if(s===2||s===6)bass(45+ch[2]-(ch[2]>6?12:0),t,.1);
    if(s===0)kick(t,.28);
    if(s===2||s===6)block(t,.12,true);else if(s%2)block(t,.05,false);
    noise(t,.03,.025,7000,1,0);
    nextT+=SD;step++}}
  function tempo(b){SD=60/b/2}
  function start(){if(!on)return;try{init();ac.resume();if(playing)return;playing=true;step=0;nextT=ac.currentTime+.08;clearInterval(timer);timer=setInterval(tick,40);tick()}catch(e){}}
  function stop(){playing=false;clearInterval(timer)}
  function fx(kind){if(!on)return;try{init();ac.resume();const t=ac.currentTime+.02;
    if(kind==='pop'){celesta(88,t,.12,0);celesta(93,t+.06,.1,0);noise(t,.05,.06,3000,2,0)}
    else if(kind==='gold'){[0,4,7,12,16,19,24].forEach((x,i)=>celesta(81+x,t+i*.06,.1,i%2?.3:-.3))}
    else if(kind==='clear'){[0,3,7,12].forEach((x,i)=>celesta(81+x,t+i*.1,.12,0))}
    else if(kind==='end'){[12,7,3,0,-5,0,12].forEach((x,i)=>pizz(69+x,t+i*.11,.2,0));celesta(93,t+.8,.12,0)}
    else if(kind==='boo'){[0,5,9].forEach((x,i)=>pizz(81+x,t+i*.05,.16,0))}
    else if(kind==='empty'){pizz(57,t,.12,0);pizz(55,t+.08,.1,0)}
    else if(kind==='rustle'){noise(t,.25,.05,2500,.7,0);noise(t+.12,.2,.04,3500,.7,0)}
    else if(kind==='go'){celesta(81,t,.1,0);celesta(88,t+.1,.1,0)}}catch(e){}}
  return {start,stop,tempo,toggle(){on=!on;if(!on)stop();return on},fx};
})();
function sfx(k){MUSIC.fx(k)}
show('startP');
})();
</script>

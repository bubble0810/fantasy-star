*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d2c;color:white;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;touch-action:manipulation}#stage{position:absolute;top:50%;left:50%;width:1024px;height:1536px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;overflow:hidden;background:#100d2c url('img/background.jpg') center/100% 100% no-repeat}#stage:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(#080b2e55 0%,transparent 17%,transparent 58%,#100b2a44 100%)}.hud{position:absolute;z-index:5;top:24px;display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 32px;gap:16px}.glass{background:#171035b8;border:2px solid #f9dba5b5;box-shadow:0 3px 20px #06041b88;border-radius:24px;color:#fff8f4}.hud button{font-size:30px;padding:15px 23px}.timer{font-size:42px;font-weight:800;min-width:245px;text-align:center;padding:10px 20px;font-variant-numeric:tabular-nums}.progressWrap{position:absolute;z-index:5;top:112px;left:18%;width:64%;text-align:center;font-size:24px;text-shadow:0 2px 8px #000}.bar{height:24px;border:2px solid #ffe3b9;border-radius:30px;background:#1912369c;overflow:hidden;margin-top:9px}.bar>div{height:100%;width:0%;background:linear-gradient(90deg,#c67cff,#ffb2d4,#ffe4a0);transition:width .6s}#bridge{position:absolute;left:12%;top:47.5%;width:76%;height:16%;object-fit:fill;opacity:0;filter:drop-shadow(0 0 15px #ffc5f7);z-index:2;transition:opacity .5s,clip-path .7s;clip-path:inset(0 50% 0 50%)}.person{position:absolute;z-index:3;top:48.4%;height:16%;object-fit:contain;filter:drop-shadow(0 4px 10px #24164e);transition:left .7s,right .7s,opacity .4s}#man{left:7%;width:18%}#woman{right:7%;width:18%}#hug{position:absolute;z-index:4;top:46%;left:40%;width:20%;height:23%;object-fit:contain;opacity:0;transition:opacity 1s;filter:drop-shadow(0 0 25px #ffd7ee)}#bird{position:absolute;z-index:4;width:110px;height:115px;object-fit:contain;display:none;filter:drop-shadow(0 0 16px #e8b5ff);pointer-events:none}#notice{position:absolute;z-index:5;top:64%;left:12%;width:76%;text-align:center;font-size:34px;font-weight:800;color:#ffe8ac;text-shadow:0 2px 14px #210d52;min-height:50px}#combo{position:absolute;z-index:5;top:69%;width:100%;text-align:center;font-size:28px;text-shadow:0 2px 9px #100c39}/* Both rows share the same five-column geometry on the 1024px stage.

</style></head><body><main id="stage"><header class="hud"><button id="exit" class="glass" aria-label="離開">← 離開</button><div class="timer glass" id="timer">00:00.0</div><button id="sound" class="glass" aria-label="聲音開關">♫ 開</button></header><div class="progressWrap">鵲橋進度<div class="bar" role="progressbar" aria-label="鵲橋完成度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div><div id="progressHint" style="margin-top:8px;font-size:22px">連擊越高，鵲橋築得越快</div></div><img id="bridge" src="img/bridge.png" alt="逐步建造的鵲橋"><img id="man" class="person" src="img/man.png" alt="牛郎"><img id="woman" class="person" src="img/woman.png" alt="織女"><img id="hug" src="img/hug.png" alt="相會"><img id="bird" src="img/bird.png" alt="喜鵲"><div id="notice">準備迎接七夕之夜</div><div id="combo">連擊 ×0</div><div id="slots" class="slots"></div><div id="choices" class="choices"></div><div id="status">記住順序，再依序點擊五種愛心</div><section id="overlay" class="overlay"><div class="panel" id="panel"><h1>七夕・心心相印</h1><p>記住依序亮起的愛心<br>正確重現序列，召喚喜鵲築橋<br>讓牛郎與織女在星河相會</p><p class="small">每顆展示 650 毫秒｜每輪 3～5 顆<br>連擊越高，鵲橋築得越快<br>答錯不會失去已築好的鵲橋<br>完成後依表現獲得 25～55 紙鶴</p><button class="primary" id="start">開始遊戲</button></div></section></main><script src="music.js?v=20261110-1"></script><script>
'use strict';const $=id=>document.getElementById(id),stage=$('stage');function resize(){stage.style.setProperty('--scale',Math.min(innerWidth/1024,innerHeight/1536))}addEventListener('resize',resize);resize();
const hearts=[4,2,0,3,1].map(i=>'img/heart'+i+'.png?v=20261110-hearts6');let state='intro',sequence=[],inputIndex=0,combo=0,maxCombo=0,progress=0,total=0,correct=0,elapsed=0,startAt=0,pausedAt=0,roundToken=0,soundOn=true,audio=null,bridgeProgress=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
for(let i=0;i<5;i++){const s=document.createElement('div');s.className='slot off';s.id='slot'+i;$('slots').append(s);const b=document.createElement('button');b.className='choice';b.setAttribute('aria-label',['同心結粉紅','彎月藍','四葉草綠','星星黃','蓮花紫'][i]);b.innerHTML=`<img src="${hearts[i]}" alt="">`;b.addEventListener('click',()=>press(i));$('choices').append(b)}
function enable(v){document.querySelectorAll('.choice').forEach(b=>b.disabled=!v)}function slots(mode){for(let i=0;i<5;i++){let s=$('slot'+i);s.className='slot'+(i>=sequence.length?' off':'');s.innerHTML='';if(mode==='show'&&i<sequence.length)s.innerHTML=`<img src="${hearts[sequence[i]]}">`;if(mode==='answer'&&i<inputIndex){s.classList.add('ok');s.innerHTML=`<img src="${hearts[sequence[i]]}">`}}}
function note(msg){$('notice').textContent=msg}function tone(freq=550,dur=.16,type='sine',vol=.07,delay=0,endFreq=freq){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(QixiMusic.output(audio));o.start(t);o.stop(t+dur+.02)}catch(e){}}
// Bright bell for a correct tap; two descending pulses for a mistake.
function correctSound(){tone(1318.51,.38,'sine',.075);tone(2637.02,.22,'sine',.024)}
function warningSound(){tone(330,.16,'triangle',.075,0,220);tone(277,.24,'triangle',.075,.19,165)}
const progressGains=[8,10,12,14,16,18,22];
function updateBridge(){const p=progress/100;document.querySelector('.bar').setAttribute('aria-valuenow',progress);$('progressHint').textContent=progress>=100?'鵲橋完成，幸福相會！':'連擊越高，鵲橋築得越快';$('fill').style.width=progress+'%';$('bridge').style.opacity=progress>0?'.98':'0';const reveal=50*p;$('bridge').style.clipPath=`inset(0 ${50-reveal}% 0 ${50-reveal}%)`;const step=clamp((p-.23)/.77,0,1);$('man').style.left=(7+step*29)+'%';$('woman').style.right=(7+step*29)+'%'}
function burst(x,y,n=24){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*Math.PI*2,d=35+Math.random()*140;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.width=s.style.height=(4+Math.random()*10)+'px';stage.append(s);setTimeout(()=>s.remove(),850)}}
function birdFlight(){const b=$('bird');b.style.display='block';b.animate([{left:'-13%',top:'55%',transform:'scaleX(1) rotate(-8deg)',opacity:0},{left:'34%',top:'47%',opacity:1},{left:'58%',top:'50%',opacity:1},{left:'110%',top:'43%',opacity:0}],{duration:1250,easing:'ease-in-out'});setTimeout(()=>b.style.display='none',1250)}
async function nextRound(){const token=++roundToken;if(state!=='play')return;sequence=Array.from({length:3+Math.floor(Math.random()*3)},()=>Math.floor(Math.random()*5));inputIndex=0;QixiMusic.focus(true);enable(false);note('記住愛心出現的順序');slots('hide');await wait(400);for(let i=0;i<sequence.length;i++){if(token!==roundToken||state!=='play')return;const s=$('slot'+i);s.innerHTML=`<img src="${hearts[sequence[i]]}">`;s.classList.remove('off');s.classList.add('ok');tone([523,587,659,784,880][sequence[i]],.2,'sine',.055);await wait(650);if(token!==roundToken||state!=='play')return;s.innerHTML='';s.classList.remove('ok');await wait(110)}if(token!==roundToken||state!=='play')return;slots('hide');state='input';QixiMusic.focus(false);note('輪到你了！依序點擊愛心');enable(true)}
async function press(i){if(state!=='input')return;const token=roundToken;document.querySelectorAll('.choice')[i].classList.add('hit');setTimeout(()=>document.querySelectorAll('.choice')[i].classList.remove('hit'),160);if(i!==sequence[inputIndex]){total++;combo=0;$('combo').textContent='連擊 ×0';updateBridge();warningSound();note('答錯了！進度保留，下一輪再試');enable(false);state='play';await wait(900);if(token===roundToken)nextRound();return}inputIndex++;correctSound();slots('answer');const button=document.querySelectorAll('.choice')[i],scale=stage.getBoundingClientRect().width/1024;const bounds=button.getBoundingClientRect(),stageBounds=stage.getBoundingClientRect();burst((bounds.left+bounds.width/2-stageBounds.left)/scale,(bounds.top+bounds.height/2-stageBounds.top)/scale,7);if(inputIndex<sequence.length)return;total++;correct++;combo++;maxCombo=Math.max(combo,maxCombo);const add=Math.min(progressGains[Math.min(combo-1,6)],100-progress);progress=Math.min(100,progress+add);$('combo').textContent='連擊 ×'+combo;note('心心相印！鵲橋更近了');enable(false);state='play';updateBridge();birdFlight();burst(512,820,32);tone(1046,.5,'sine',.065);if(progress>=100){finish();return}await wait(1350);if(token===roundToken)nextRound()}
function clock(){if(state==='play'||state==='input'){elapsed=(performance.now()-startAt)/1000;const m=String(Math.floor(elapsed/60)).padStart(2,'0'),s=(elapsed%60).toFixed(1).padStart(4,'0');$('timer').textContent=m+':'+s}requestAnimationFrame(clock)}requestAnimationFrame(clock);
function reward(){const accuracy=total?correct/total:0;const a=accuracy*50,b=Math.min(maxCombo/8,1)*30,c=Math.max(0,1-elapsed/180)*20;const tier=clamp(2+Math.floor((a+b+c)/17),2,7);return 25+(tier-2)*6}
async function finish(){state='done';QixiMusic.stop();roundToken++;enable(false);$('man').style.opacity='0';$('woman').style.opacity='0';$('hug').style.opacity='1';note('鵲橋相會！');burst(512,835,100);[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.7,'sine',.12),i*210));await wait(2300);$('panel').innerHTML=`<h1>鵲橋相會</h1><p>兩人終於在七夕重逢！</p><p>完成時間：${elapsed.toFixed(1)} 秒<br>命中率：${(correct/Math.max(total,1)*100).toFixed(1)}%<br>最高 Combo：×${maxCombo}</p><p style="color:#ffdc9d;font-size:43px">獲得紙鶴 ×${reward()}</p><p class="small">${new URLSearchParams(location.search).get('trial')==='1'?'星宮體驗不發正式獎勵':'正式活動完成後，由主站確認紙鶴入帳'}</p><button class="primary" id="again">再玩一次</button><button class="primary" id="out">返回活動頁</button>`;$('overlay').style.display='flex';$('again').onclick=begin;fsReport(reward())}
function begin(){roundToken++;state='play';combo=maxCombo=progress=total=correct=elapsed=0;startAt=performance.now();$('overlay').style.display='none';$('hug').style.opacity='0';$('man').style.opacity='1';$('woman').style.opacity='1';$('combo').textContent='連擊 ×0';updateBridge();audio=audio||new (window.AudioContext||window.webkitAudioContext)();tone(523,.3);QixiMusic.start(audio);nextRound()}
$('start').onclick=begin;
window.fsQuestionsReady=false;
const startButton=$('start');startButton.disabled=true;startButton.textContent='素材載入中…';
const loadStatus=document.createElement('p');loadStatus.id='loadStatus';loadStatus.className='small';loadStatus.setAttribute('role','status');$('panel').append(loadStatus);
Promise.all(['background.jpg','heart0.png','heart1.png','heart2.png','heart3.png','heart4.png','bridge.png','man.png','woman.png','hug.png','bird.png'].map(file=>new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(new Error(file));img.src=['img',file].join('/')}))).then(()=>{if(!window.QixiMusic)throw new Error('music.js');window.fsQuestionsReady=true;startButton.disabled=false;startButton.textContent='開始遊戲';loadStatus.textContent='';}).catch(error=>{window.fsQuestionsReady=false;startButton.disabled=true;startButton.textContent='暫時無法開始';loadStatus.textContent='素材載入失敗：'+error.message+'。尚未扣除次數或星星糖，可以先返回再試。';});

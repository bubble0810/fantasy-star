<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>幻想智慧星・管理後台</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{--ink:#2e2340;--muted:#6b5b7d;--line:#e3d9ef;--bg:#f6f2fb;--accent:#c23258;--ok:#1f7a45;--warn:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;color:var(--accent)}
nav{display:flex;gap:4px}
nav button,.btn{min-height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;font:inherit;color:var(--ink);cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.danger{color:var(--warn);border-color:#f1c4c0}
.btn:disabled{opacity:.5}
.who{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
main{padding:16px;max-width:1400px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(0,1.4fr);gap:16px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:16px}
.card h3{margin:6px 0 0;font-size:14px;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
textarea{width:100%;min-height:80px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
tbody tr{cursor:pointer}tbody tr:hover{background:#faf6ff}tbody tr.sel{background:#f1e8ff}
.tablewrap{overflow-x:auto;max-height:70vh;overflow-y:auto}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center}
.kv span{color:var(--muted)}
.pw{font-size:22px;letter-spacing:4px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 8px;background:#eee}
.tag.on{background:#e3f6ea;color:var(--ok)}.tag.off{background:#fde8e6;color:var(--warn)}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-height:340px;overflow-y:auto}
.looks label{border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:11px;text-align:center;gap:2px;cursor:pointer}
.looks label.own{border-color:var(--accent);background:#fff2f6}
.looks img{height:60px;width:auto}
.homes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.homes label{border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;gap:6px;align-items:center;font-size:12px;cursor:pointer}
.homes label.own{border-color:var(--accent);background:#fff2f6}
.homes img{width:48px;height:32px;object-fit:cover;border-radius:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.nums label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.mail{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.mail small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:20}
.login{max-width:380px;margin:12vh auto}
.login input{width:100%}
.stage{display:flex;gap:10px;align-items:flex-end}
.stage img{height:150px;width:auto}
details summary{cursor:pointer;font-weight:700}
.sub{display:flex;gap:4px;flex-wrap:wrap}.sub button{min-height:34px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;font:inherit;cursor:pointer}
.sub button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi small{color:var(--muted);display:block}.kpi b{font-size:24px}
.bar{height:12px;border-radius:6px;background:#e2508f;min-width:2px}.bar.b2{background:#8a7dff}
td.barc{width:40%;min-width:120px}
.days{display:flex;align-items:flex-end;gap:3px;height:160px;border-bottom:1px solid var(--line);padding-top:10px}
.days>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%;font-size:10px;color:var(--muted)}
.days i{display:block;width:100%;background:#e2508f;border-radius:4px 4px 0 0;min-height:1px}.days i.n{background:#8a7dff}
.thumb{height:36px;width:auto;vertical-align:middle;border-radius:4px}
.note{color:var(--muted);font-size:12px;margin:0}
</style>
</head>
<body>
<div id="app"><div class="login card"><h2>幻想智慧星・管理後台</h2><p id="boot">讀取中…</p></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s),app=$('#app');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
if(!window.CLOUD_GATE){app.innerHTML=`<div class="login card"><h2>還沒設定 Firebase</h2><p>請先把 Firebase 設定碼填進 <b>firebase-config.js</b>，再重新整理這一頁。</p></div>`;return}
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
let PETS=[],CATS=[],GAMEF=[],stSub='games',stRange=7;
let ME=null,PLAYERS=[],SEL=null,SELS=null,LOOKS=[],HOMES=[],tab='players',sortK='lastLogin',sortD=-1,q='';

/* 從遊戲檔讀出造型和小屋清單 */
async function loadCatalog(){
  try{const t=await (await fetch('index.html',{cache:'no-store'})).text();
    const m=t.match(/const LOOKS=(\[.*?\]\]);/s);if(m)LOOKS=JSON.parse(m[1]).filter(r=>!/B$/.test(r[0]));
    const hb=t.slice(t.indexOf('const HOMES=['),t.indexOf('];',t.indexOf('const HOMES=['))+2);
    HOMES=[...hb.matchAll(/\{id:'(\w+)',n:'([^']+)'[^}]*?img:'([^']+)'[^}]*\}/g)].map(x=>({id:x[1],n:x[2],img:x[3],fest:(x[0].match(/fest:'(\w+)'/)||[])[1]||''}));
    const pb=t.slice(t.indexOf('const PETS=['),t.indexOf('];',t.indexOf('const PETS=['))+2);
    PETS=[...pb.matchAll(/\{k:'(\w+)',n:'([^']+)',lv:(\d+),cost:(\d+)[^}]*?(hide:1)?[^}]*\}/g)].filter(x=>!/hide:1/.test(x[0])).map(x=>({k:x[1],n:x[2],cost:+x[4],img:(x[0].match(/img:'([^']+)'/)||[])[1]||''}));
    const cm=t.match(/const CATS=\[([\s\S]*?)\];/);if(cm)CATS=[...cm[1].matchAll(/k:'(\w+)',n:'([^']+)'/g)].map(x=>({k:x[1],n:x[2]}));
    try{const g=await (await fetch('festgames.js',{cache:'no-store'})).text();
      GAMEF=[...g.matchAll(/(\w+):\s*\{n:'([^']+)',title:'([^']+)',cur:'([^']+)',ic:'([^']+)'.*?home:'(\w+)',lk:'(\w+)'/g)].map(x=>({k:x[1],n:x[2],title:x[3],cur:x[4],ic:x[5],home:x[6],lk:x[7]}))}catch(e){}
  }catch(e){toast('讀不到遊戲的造型清單（請確認 admin.html 和 index.html 放在同一個資料夾）')}
}
const fmt=ts=>ts&&ts.toDate?ts.toDate().toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const lvOf=exp=>{let l=1,t=0;while(true){const need=Math.min(100*l,600);if(exp<t+need)return l;t+=need;l++}};
async function log(action,target,detail){try{await db.collection('adminlog').add({at:FV.serverTimestamp(),admin:ME.email,action,target:target||'',detail:detail||''})}catch(e){}}

/* ---------- 登入 ---------- */
function loginView(msg){
  app.innerHTML=`<form class="login card" id="lf"><h2>幻想智慧星・管理後台</h2>
  <label>管理員 Email<input id="le" type="email" autocomplete="username" required></label>
  <label>密碼<input id="lp" type="password" autocomplete="current-password" required></label>
  <p style="color:var(--warn);margin:0">${esc(msg||'')}</p><button class="btn primary">登入</button></form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value)}catch(er){loginView('登入失敗：'+(er.code||er.message))}};
}
auth.onAuthStateChanged(async u=>{
  if(!u)return loginView();
  const a=await db.doc('admins/'+u.uid).get().catch(()=>null);
  if(!a||!a.exists){app.innerHTML=`<div class="login card"><h2>這個帳號不是管理員</h2><p>請到 Firestore 建立 <b>admins/${esc(u.uid)}</b> 這份文件，再重新整理。</p><p style="font-size:12px;color:var(--muted)">你的 UID：${esc(u.uid)}</p><button class="btn" id="lo">登出</button></div>`;$('#lo').onclick=()=>auth.signOut();return}
  ME=u;await loadCatalog();shell();loadPlayers();
});

/* ---------- 外框 ---------- */
function shell(){
  app.innerHTML=`<header><h1>幻想智慧星・管理後台</h1><nav>
  <button data-t="players">玩家</button><button data-t="stat">📊 統計</button><button data-t="bc">寄信給全部玩家</button><button data-t="log">操作紀錄</button></nav>
  <div class="who">${esc(ME.email)}<button class="btn" id="lo">登出</button></div></header><main id="main"></main>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;view()});
  $('#lo').onclick=()=>auth.signOut();view();
}
function view(){app.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
  if(tab==='players')playersView();else if(tab==='stat')statView();else if(tab==='bc')bcView();else logView()}

/* ---------- 玩家列表 ---------- */
async function loadPlayers(){
  const s=await db.collection('players').get();PLAYERS=s.docs.map(d=>({uid:d.id,...d.data()}));if(tab==='players')playersView();
}
function playersView(){
  const m=$('#main');
  const rows=PLAYERS.filter(p=>!q||(p.name||'').includes(q)||(p.code||'').includes(q.toLowerCase()))
    .sort((a,b)=>{const va=a[sortK],vb=b[sortK];const x=va&&va.toMillis?va.toMillis():va??'',y=vb&&vb.toMillis?vb.toMillis():vb??'';return (x>y?1:x<y?-1:0)*sortD});
  const H=[['name','暱稱'],['code','帳號'],['exp','等級'],['candy','星星糖'],['looks','造型'],['homes','小屋'],['lastLogin','最後登入'],['disabled','狀態']];
  m.innerHTML=`<div class="grid"><div class="card"><div class="row"><h2>玩家（${PLAYERS.length} 人）</h2><button class="btn" id="rf">重新整理</button></div>
    <input id="qs" placeholder="搜尋暱稱或帳號" value="${esc(q)}">
    <div class="tablewrap"><table><thead><tr>${H.map(([k,t])=>`<th data-k="${k}">${t}${sortK===k?(sortD>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(p=>`<tr data-u="${p.uid}" class="${SEL&&SEL.uid===p.uid?'sel':''}"><td>${esc(p.name)}</td><td>${esc(p.code)}</td><td>Lv.${lvOf(p.exp||0)}</td><td>${p.candy||0}</td><td>${p.looks||0}</td><td>${p.homes||0}</td><td>${fmt(p.lastLogin)}</td><td>${p.disabled?'<span class="tag off">停用</span>':'<span class="tag on">正常</span>'}</td></tr>`).join('')||`<tr><td colspan="8" class="empty">還沒有玩家</td></tr>`}
    </tbody></table></div></div><div id="detail">${SEL?'':'<div class="card empty">點左邊的玩家，查看他的全部資料</div>'}</div></div>`;
  $('#rf').onclick=loadPlayers;
  $('#qs').oninput=e=>{q=e.target.value.trim();const pos=e.target.selectionStart;playersView();const i=$('#qs');i.focus();i.setSelectionRange(pos,pos)};
  m.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{if(sortK===th.dataset.k)sortD*=-1;else{sortK=th.dataset.k;sortD=-1}playersView()});
  m.querySelectorAll('tr[data-u]').forEach(tr=>tr.onclick=()=>openPlayer(tr.dataset.u));
  if(SEL)detailView();
}

/* ---------- 玩家詳細 ---------- */
async function openPlayer(uid){
  const [d,pv,mb]=await Promise.all([db.doc('players/'+uid).get(),db.doc('private/'+uid).get(),db.collection(`players/${uid}/inbox`).orderBy('createdAt','desc').limit(50).get()]);
  SEL={uid,...d.data(),pw:pv.exists?pv.data():{},mail:mb.docs.map(x=>({id:x.id,...x.data()}))};
  try{SELS=SEL.sj?JSON.parse(SEL.sj):{}}catch(e){SELS={}}
  playersView();
}
function detailView(){
  const p=SEL,S=SELS,el=$('#detail');if(!el)return;
  const items=new Set(S.items||[]),homes=new Set(S.homes||[]),ch=S.char||'f';
  const sp=S.eqs&&S.eqs[ch]&&S.eqs[ch].special;const cur=sp?String(sp).replace('L-',''):'';
  const fc=[['hw','萬聖糖果',S.hw&&S.hw.c]];
  for(const [k,v] of Object.entries(S.fest||{}))fc.push(['fest.'+k,'節慶貨幣：'+k,v&&v.c]);
  el.innerHTML=`<div class="card">
  <div class="row"><h2>${esc(p.name)}</h2>${p.disabled?'<span class="tag off">停用中</span>':'<span class="tag on">正常</span>'}</div>
  <div class="stage">${cur?`<img src="outfits/${esc(cur)}.webp" alt="目前穿著">`:''}<div class="kv">
    <span>帳號</span><b>${esc(p.code)}</b>
    <span>密碼</span><b class="pw" title="${esc(p.pw.pwName||'')}">${esc(p.pw.pw||'（沒有紀錄）')}</b>
    <span></span><small>${esc(p.pw.pwName||'')}</small>
    <span>角色</span><b>${S.char==='m'?'男生':S.char==='f'?'女生':'還沒選'}</b>
    <span>等級</span><b>Lv.${lvOf(S.exp||0)}（經驗值 ${S.exp||0}）</b>
    <span>註冊</span><b>${fmt(p.createdAt)}</b><span>最後登入</span><b>${fmt(p.lastLogin)}</b><span>最後存檔</span><b>${fmt(p.updatedAt)}</b>
    <span>UID</span><small>${esc(p.uid)}</small></div></div>

  <h3>基本資料與數值</h3>
  <div class="nums">
    <label>暱稱<input id="eName" value="${esc(p.name)}" maxlength="8"></label>
    <label>星星糖<input id="eCandy" type="number" min="0" value="${S.candy||0}"></label>
    <label>經驗值<input id="eExp" type="number" min="0" value="${S.exp||0}"></label>
    <label>已過關到第幾關（maxLv）<input id="eMax" type="number" min="0" max="108" value="${S.maxLv||0}"></label>
    ${fc.map(([k,t,v])=>`<label>${esc(t)}<input data-fc="${k}" type="number" min="0" value="${v||0}"></label>`).join('')}
  </div>

  <h3>造型（打勾＝擁有，${[...items].filter(x=>x.startsWith('L-')).length} 套）</h3>
  <div class="looks">${LOOKS.map(r=>{const id='L-'+r[0],o=items.has(id);return `<label class="${o?'own':''}"><input type="checkbox" data-look="${id}" ${o?'checked':''}><img src="outfits/${r[0]}.webp" alt="" loading="lazy">${esc(r[0])}<br>${esc(r[2])}</label>`}).join('')}</div>

  <h3>小屋（打勾＝擁有）</h3>
  <div class="homes">${HOMES.map(h=>{const o=homes.has(h.id);return `<label class="${o?'own':''}"><input type="checkbox" data-home="${h.id}" ${o?'checked':''} ${h.id==='R00'?'disabled':''}><img src="${esc(h.img)}" alt="">${esc(h.fest?h.id.replace(/^SP/,'RSP'):h.id)} ${esc(h.n)}</label>`}).join('')}</div>

  <details><summary>進階：直接編輯全部遊戲資料（JSON）</summary><p style="color:var(--muted);margin:6px 0">改這裡會蓋過上面的設定，請小心。</p><textarea id="eRaw" style="min-height:240px;font-family:monospace;font-size:12px">${esc(JSON.stringify(S,null,1))}</textarea></details>

  <div class="row"><button class="btn primary" id="eSave">儲存修改</button><button class="btn ${p.disabled?'':'danger'}" id="eDis">${p.disabled?'恢復帳號':'停用帳號'}</button></div>
  <p style="color:var(--muted);margin:0;font-size:12px">玩家正在玩的話，遊戲會自動重新讀取並顯示「管理員更新了你的資料」。</p>
  </div>

  <div class="card"><h2>寄信給 ${esc(p.name)}</h2>${mailForm('m')}<button class="btn primary" id="mSend">寄出</button>
  <h3>信件紀錄</h3>${p.mail.length?p.mail.map(x=>`<div class="mail"><div><b>${x.kind==='gift'?'🎁':x.kind==='system'?'🔔':'📢'} ${esc(x.title)}</b>${x.bc?' <small>（全體信）</small>':''}<br><small>${fmt(x.createdAt)}・${x.claimed?'已領取 '+fmt(x.claimedAt):x.read?'已讀':'還沒看'}</small></div>${x.claimed?'':`<button class="btn danger" data-recall="${x.id}">收回</button>`}</div>`).join(''):'<p class="empty">還沒有信</p>'}</div>

  <div class="card"><h2>搬移進度</h2><p style="margin:0;color:var(--muted)">小朋友忘記密碼、改用新帳號時，把這個帳號的進度整份複製到新帳號。新帳號原本的進度會被蓋掉。</p>
  <div class="row"><input id="mvTo" placeholder="新帳號"><button class="btn" id="mvGo">搬過去</button></div></div>`;

  el.querySelectorAll('.looks input,.homes input').forEach(c=>c.onchange=()=>c.parentElement.classList.toggle('own',c.checked));
  $('#eSave').onclick=saveEdit;$('#eDis').onclick=toggleDis;$('#mSend').onclick=()=>sendMail(p.uid);$('#mvGo').onclick=moveProgress;
  el.querySelectorAll('[data-recall]').forEach(b=>b.onclick=()=>recall(b.dataset.recall));
}
function mailForm(px){return `<div class="nums">
  <label>種類<select id="${px}Kind"><option value="gift">🎁 禮物</option><option value="notice">📢 公告</option></select></label>
  <label>標題<input id="${px}Title" placeholder="例如：生日快樂！"></label>
  <label>幾天內要領取<input id="${px}Days" type="number" min="0" value="7"><small>0＝沒有期限</small></label></div>
  <textarea id="${px}Body" placeholder="內文（可以不寫）"></textarea>
  <div class="nums"><label>附件：星星糖<input id="${px}Candy" type="number" min="0" value="0"></label><label>附件：經驗值<input id="${px}Exp" type="number" min="0" value="0"></label>
  <label>附件：造型<select id="${px}Look"><option value="">（不送）</option>${LOOKS.map(r=>`<option value="${r[0]}">${r[0]} ${esc(r[2])}</option>`).join('')}</select></label>
  <label>附件：小屋<select id="${px}Home"><option value="">（不送）</option>${HOMES.filter(h=>h.id!=='R00').map(h=>`<option value="${h.id}">${esc(h.fest?h.id.replace(/^SP/,'RSP'):h.id)} ${esc(h.n)}</option>`).join('')}</select></label></div>`}
function readMail(px){
  const title=$('#'+px+'Title').value.trim();if(!title){toast('請寫標題');return null}
  const days=+$('#'+px+'Days').value||0,att={};
  const c=+$('#'+px+'Candy').value||0,e=+$('#'+px+'Exp').value||0,l=$('#'+px+'Look').value,h=$('#'+px+'Home').value;
  if(c)att.candy=c;if(e)att.exp=e;if(l)att.looks=[l];if(h)att.homes=[h];
  const kind=Object.keys(att).length?'gift':$('#'+px+'Kind').value;
  return {title,body:$('#'+px+'Body').value.trim(),kind,att,createdAt:FV.serverTimestamp(),expireAt:days?firebase.firestore.Timestamp.fromMillis(Date.now()+days*864e5):null,read:false,claimed:false};
}
async function saveEdit(){
  const p=SEL;let S;
  try{S=JSON.parse($('#eRaw').value)}catch(e){return toast('進階 JSON 格式有錯，沒有儲存')}
  const raw0=JSON.stringify(SELS);
  if(JSON.stringify(S)===raw0){ // 沒動 JSON，就用上面的欄位
    S.candy=+$('#eCandy').value||0;S.exp=+$('#eExp').value||0;S.maxLv=+$('#eMax').value||0;
    document.querySelectorAll('[data-fc]').forEach(i=>{const k=i.dataset.fc,v=+i.value||0;if(k==='hw'){S.hw=S.hw||{c:0,first:0,best:0,clears:0};S.hw.c=v}else{const f=k.split('.')[1];S.fest=S.fest||{};S.fest[f]=S.fest[f]||{};S.fest[f].c=v}});
    const looks=[...document.querySelectorAll('[data-look]')].filter(c=>c.checked).map(c=>c.dataset.look);
    S.items=(S.items||[]).filter(x=>!x.startsWith('L-')).concat(looks);
    S.homes=['R00',...[...document.querySelectorAll('[data-home]')].filter(c=>c.checked&&c.dataset.home!=='R00').map(c=>c.dataset.home)];
    if(S.home&&!S.homes.includes(S.home))S.home='R00';
  }
  const name=$('#eName').value.trim()||p.name;
  const sum={sj:JSON.stringify(S),name,exp:S.exp|0,candy:S.candy|0,char:S.char||null,maxLv:S.maxLv|0,looks:(S.items||[]).filter(x=>x.startsWith('L-')).length,homes:(S.homes||[]).length,updatedAt:FV.serverTimestamp(),adminRev:FV.increment(1)};
  try{await db.doc('players/'+p.uid).update(sum);await log('修改資料',p.code,`星星糖 ${S.candy}・經驗值 ${S.exp}・造型 ${sum.looks}・小屋 ${sum.homes}${name!==p.name?'・名稱改為 '+name:''}`);
    toast('已儲存');await loadPlayers();openPlayer(p.uid)}catch(e){toast('儲存失敗：'+(e.code||e.message))}
}
async function toggleDis(){const p=SEL;const to=!p.disabled;if(to&&!confirmBox(`確定要停用「${p.name}」的帳號嗎？`))return;
  try{await db.doc('players/'+p.uid).update({disabled:to});await log(to?'停用帳號':'恢復帳號',p.code);toast(to?'已停用':'已恢復');await loadPlayers();openPlayer(p.uid)}catch(e){toast('失敗：'+(e.code||e.message))}}
function confirmBox(msg){return window.confirm?window.confirm(msg):true}
async function sendMail(uid){const m=readMail('m');if(!m)return;
  try{await db.collection(`players/${uid}/inbox`).add(m);await log('寄信',SEL.code,m.title+(Object.keys(m.att).length?'（有附件）':''));toast('已寄出');openPlayer(uid)}catch(e){toast('寄信失敗：'+(e.code||e.message))}}
async function recall(id){if(!confirmBox('確定收回這封信？'))return;
  try{await db.doc(`players/${SEL.uid}/inbox/${id}`).delete();await log('收回信件',SEL.code,id);toast('已收回');openPlayer(SEL.uid)}catch(e){toast('失敗：'+(e.code||e.message))}}
async function moveProgress(){
  const code=$('#mvTo').value.trim().toLowerCase();const to=PLAYERS.find(p=>p.code===code);
  if(!to)return toast('找不到這個帳號');if(to.uid===SEL.uid)return toast('不能搬給自己');
  if(!confirmBox(`把「${SEL.name}」的進度複製到「${to.name}（${to.code}）」？${to.name} 原本的進度會被蓋掉。`))return;
  try{await db.doc('players/'+to.uid).update({sj:SEL.sj||'',exp:SEL.exp||0,candy:SEL.candy||0,char:SEL.char||null,maxLv:SEL.maxLv||0,looks:SEL.looks||0,homes:SEL.homes||1,updatedAt:FV.serverTimestamp(),adminRev:FV.increment(1)});
    await log('搬移進度',SEL.code+' → '+to.code);toast('已搬移');loadPlayers()}catch(e){toast('失敗：'+(e.code||e.message))}
}

/* ---------- 寄信給全部玩家 ---------- */
/* ---------- 統計 ---------- */
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function lastDays(n){const o=[];const d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);o.push(dkey(x))}return o}
function pdata(p){if(p._S!==undefined)return p._S;try{p._S=p.sj?JSON.parse(p.sj):{}}catch(e){p._S={}}return p._S}
function pcount(p,key){const st=(pdata(p).st)||{};if(!stRange)return (st.t||{})[key]||0;let n=0;for(const k of lastDays(stRange))n+=((st.d||{})[k]||{})[key]||0;return n}
function agg(keys){return keys.map(([key,label,extra])=>{let tot=0,ppl=0;for(const p of PLAYERS){const n=pcount(p,key);tot+=n;if(n)ppl++}return {key,label,extra,tot,ppl}})}
function barTable(rows,cols){const mx=Math.max(1,...rows.map(r=>r.tot));
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.label}</td>${r.cells.map(c=>`<td>${c}</td>`).join('')}<td class="barc"><div class="bar" style="width:${r.tot/mx*100}%"></div></td></tr>`).join('')||'<tr><td colspan="9" class="empty">還沒有資料</td></tr>'}</tbody></table></div>`}
const rangeName=()=>stRange?`最近 ${stRange} 天`:'全部時間';
function statView(){
  const m=$('#main');
  m.innerHTML=`<div class="card"><div class="row"><h2>📊 統計</h2><div class="sub" id="ss">${[['games','遊戲統計'],['sales','銷售狀態'],['active','活躍玩家'],['fest','節慶活動']].map(([k,n])=>`<button data-s="${k}" aria-pressed="${stSub===k}">${n}</button>`).join('')}</div>
    <span style="margin-left:auto"></span><select id="sr">${[[1,'今天'],[7,'最近 7 天'],[30,'最近 30 天'],[0,'全部時間']].map(([v,n])=>`<option value="${v}" ${stRange===v?'selected':''}>${n}</option>`).join('')}</select><button class="btn" id="srf">重新整理</button></div>
    <p class="note">統計從 v3 更新後開始記錄，之前玩過的次數沒有紀錄。「擁有人數」是從每位玩家的存檔算出來的，包含更新前買的東西。</p>
    <div id="sbody"></div></div>`;
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{stSub=b.dataset.s;statView()});
  $('#sr').onchange=e=>{stRange=+e.target.value;statView()};
  $('#srf').onclick=async()=>{await loadPlayers();PLAYERS.forEach(p=>delete p._S);tab='stat';view()};
  const B=$('#sbody');
  if(stSub==='games')B.innerHTML=gamesStat();else if(stSub==='sales')B.innerHTML=salesStat();else if(stSub==='active')B.innerHTML=activeStat();else B.innerHTML=festStat();
  B.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{salesCat=b.dataset.cat;statView()});
}
function gamesStat(){
  const keys=[['g:maze','⚡ 電流急急棒'],['g:memory','🃏 記憶翻牌'],['g:stroop','🎨 顏色陷阱'],['g:dice','🎲 家園擲骰子'],['q:all','📝 答題・綜合大冒險'],
    ...CATS.map(c=>['q:'+c.k,'📝 答題・'+c.n]),...GAMEF.map(g=>['f:'+g.k,`${g.ic} 節慶・${g.title}`])];
  const rows=agg(keys).sort((a,b)=>b.tot-a.tot||b.ppl-a.ppl);
  const sum=rows.reduce((a,r)=>a+r.tot,0);
  return `<div class="kpis"><div class="kpi"><small>${rangeName()}總遊玩次數</small><b>${sum}</b></div><div class="kpi"><small>最受歡迎</small><b style="font-size:16px">${rows[0]&&rows[0].tot?rows[0].label:'—'}</b></div></div>
  <h3>依遊玩次數排序（${rangeName()}）</h3>`+barTable(rows.map(r=>({...r,cells:[r.tot,r.ppl,r.ppl?(r.tot/r.ppl).toFixed(1):'—']})),['遊戲','遊玩次數','玩過的人數','平均每人']);
}
let salesCat='looks';
function salesStat(){
  const own={},sold={};
  for(const p of PLAYERS){const S=pdata(p);(S.items||[]).forEach(x=>{own[x]=(own[x]||0)+1});(S.homes||[]).forEach(x=>{own[x]=(own[x]||0)+1});(S.pets||[]).forEach(x=>{if(x&&x.k)own['pet-'+x.k]=(own['pet-'+x.k]||0)+1})}
  const sc=id=>{let n=0;for(const p of PLAYERS)n+=pcount(p,'b:'+id);return n};
  let list=[];
  if(salesCat==='looks')list=LOOKS.map(r=>({id:'L-'+r[0],label:`<img class="thumb" src="outfits/${esc(r[0])}.webp" alt=""> ${esc(r[0].replace(/^[MF]SP/,'SP'))} ${esc(r[2])} <small>${r[1]==='m'?'男':'女'}</small>`}));
  else if(salesCat==='homes')list=HOMES.filter(h=>h.id!=='R00').map(h=>({id:h.id,label:`<img class="thumb" src="${esc(h.img)}" alt=""> ${esc(h.id.replace(/^SP/,'RSP'))} ${esc(h.n)}`}));
  else list=PETS.filter(x=>x.cost>0).map(x=>({id:'pet-'+x.k,label:`${x.img?`<img class="thumb" src="${esc(x.img)}" alt="">`:''} ${esc(x.n)}`}));
  const rows=list.map(x=>({label:x.label,tot:sc(x.id),own:own[x.id]||0})).sort((a,b)=>b.tot-a.tot||b.own-a.own);
  rows.forEach(r=>r.cells=[r.tot,r.own,PLAYERS.length?Math.round(r.own/PLAYERS.length*100)+'%':'—']);
  const total=rows.reduce((a,r)=>a+r.tot,0),never=rows.filter(r=>!r.own).length;
  return `<div class="sub" style="margin:8px 0">${[['looks','👗 造型'],['homes','🏠 小屋'],['pets','🐰 寵物']].map(([k,n])=>`<button data-cat="${k}" aria-pressed="${salesCat===k}">${n}</button>`).join('')}</div>
  <div class="kpis"><div class="kpi"><small>${rangeName()}賣出</small><b>${total}</b></div><div class="kpi"><small>還沒有人擁有</small><b>${never}</b><small>共 ${rows.length} 項</small></div></div>
  <h3>依${rangeName()}賣出數量排序</h3>`+barTable(rows,['商品',`${rangeName()}賣出`,'目前擁有人數','擁有比例']).replace(/class="bar"/g,'class="bar b2"');
}
function activeStat(){
  const N=stRange&&stRange>1?stRange:30,days=lastDays(N);
  const act=days.map(k=>PLAYERS.filter(p=>{const d=((pdata(p).st||{}).d||{})[k];return d&&Object.keys(d).length}).length);
  const reg=days.map(k=>PLAYERS.filter(p=>p.createdAt&&p.createdAt.toDate&&dkey(p.createdAt.toDate())===k).length);
  const uniq=n=>{const ks=lastDays(n);return PLAYERS.filter(p=>{const D=(pdata(p).st||{}).d||{};return ks.some(k=>D[k]&&Object.keys(D[k]).length)}).length};
  const mx=Math.max(1,...act,...reg);
  return `<div class="kpis"><div class="kpi"><small>全部玩家</small><b>${PLAYERS.length}</b></div><div class="kpi"><small>今天上線</small><b>${act[act.length-1]}</b></div>
  <div class="kpi"><small>最近 7 天上線</small><b>${uniq(7)}</b></div><div class="kpi"><small>最近 30 天上線</small><b>${uniq(30)}</b></div><div class="kpi"><small>最近 ${N} 天新註冊</small><b>${reg.reduce((a,b)=>a+b,0)}</b></div></div>
  <h3>每天人數（最近 ${N} 天）<span style="font-weight:400"> ・ <span style="color:#e2508f">■</span> 上線人數 <span style="color:#8a7dff">■</span> 新註冊</span></h3>
  <div class="days">${days.map((k,i)=>`<div title="${k}：上線 ${act[i]} 人、新註冊 ${reg[i]} 人"><span>${act[i]||''}</span><div style="display:flex;gap:1px;width:100%;align-items:flex-end;flex:1"><i style="height:${act[i]/mx*100}%"></i><i class="n" style="height:${reg[i]/mx*100}%"></i></div><span>${N<=31&&(i%Math.ceil(N/10)===0||i===N-1)?k.slice(5):''}</span></div>`).join('')}</div>`;
}
function festStat(){
  if(!GAMEF.length)return '<p class="empty">讀不到節慶活動設定（festgames.js）</p>';
  const own=id=>PLAYERS.filter(p=>{const S=pdata(p);return (S.items||[]).includes(id)||(S.homes||[]).includes(id)}).length;
  const sum=key=>PLAYERS.reduce((a,p)=>a+pcount(p,key),0),ppl=key=>PLAYERS.filter(p=>pcount(p,key)>0).length;
  return GAMEF.map(g=>{const n=ppl('f:'+g.k),runs=sum('f:'+g.k),cur=sum('fc:'+g.k);
    const ex=[['look','節慶服裝'],['room','節慶小屋'],['stars','換星星糖 300'],['dice','骰子加碼券']].map(([k,t])=>[t,sum('fx:'+g.k+':'+k)]);
    const ol=own('L-M'+g.lk)+own('L-F'+g.lk),or=own(g.home);
    return `<div class="card" style="margin-top:10px"><h2>${g.ic} ${esc(g.n)}・${esc(g.title)}</h2>
    <div class="kpis"><div class="kpi"><small>參加人數</small><b>${n}</b><small>佔全部玩家 ${PLAYERS.length?Math.round(n/PLAYERS.length*100):0}%</small></div><div class="kpi"><small>遊玩次數</small><b>${runs}</b><small>平均每人 ${n?(runs/n).toFixed(1):'—'} 次</small></div>
    <div class="kpi"><small>獲得${esc(g.cur)}</small><b>${cur}</b></div><div class="kpi"><small>擁有節慶服裝</small><b>${ol}</b><small>${esc(g.lk.replace(/^SP/,'SP'))}</small></div><div class="kpi"><small>擁有節慶小屋</small><b>${or}</b><small>${esc(g.home.replace(/^SP/,'RSP'))}</small></div></div>
    <h3>兌換紀錄（${rangeName()}）</h3><div class="row">${ex.map(([t,v])=>`<span class="tag">${t}：<b>${v}</b></span>`).join('')}</div></div>`}).join('');
}
async function bcView(){
  const m=$('#main');m.innerHTML=`<div class="grid"><div class="card"><h2>寄信給全部玩家</h2><p style="margin:0;color:var(--muted)">每位玩家下次登入時都會收到，之後才註冊的新玩家也會收到（期限內）。</p>${mailForm('b')}<button class="btn primary" id="bSend">寄給全部玩家</button></div><div class="card"><h2>已寄出的全體信</h2><div id="bList">讀取中…</div></div></div>`;
  $('#bSend').onclick=async()=>{const x=readMail('b');if(!x)return;delete x.read;delete x.claimed;
    if(!confirmBox(`確定寄給全部玩家？\n${x.title}`))return;
    try{await db.collection('broadcasts').add(x);await log('寄全體信','全部玩家',x.title);toast('已寄出');bcView()}catch(e){toast('失敗：'+(e.code||e.message))}};
  const s=await db.collection('broadcasts').orderBy('createdAt','desc').limit(50).get();
  $('#bList').innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="mail"><div><b>${x.kind==='gift'?'🎁':'📢'} ${esc(x.title)}</b><br><small>${fmt(x.createdAt)}${x.expireAt?'・期限 '+fmt(x.expireAt):''}</small></div><button class="btn danger" data-del="${d.id}">停止發送</button></div>`}).join('')||'<p class="empty">還沒有寄過</p>';
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirmBox('停止發送這封信？已經收到的玩家不受影響。'))return;await db.doc('broadcasts/'+b.dataset.del).delete();await log('停止全體信','',b.dataset.del);bcView()});
}

/* ---------- 操作紀錄 ---------- */
async function logView(){
  const m=$('#main');m.innerHTML=`<div class="card"><h2>操作紀錄（最近 200 筆）</h2><div class="tablewrap" id="lg">讀取中…</div></div>`;
  const s=await db.collection('adminlog').orderBy('at','desc').limit(200).get();
  $('#lg').innerHTML=`<table><thead><tr><th>時間</th><th>動作</th><th>對象</th><th>內容</th><th>管理員</th></tr></thead><tbody>${s.docs.map(d=>{const x=d.data();return `<tr><td>${fmt(x.at)}</td><td>${esc(x.action)}</td><td>${esc(x.target)}</td><td style="white-space:normal">${esc(x.detail)}</td><td>${esc(x.admin)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">還沒有紀錄</td></tr>'}</tbody></table>`;
}
})();

<script>
const SND=(()=>{
  let ctx=null,master=null,sfxBus=null,bgmBus=null,timer=0,nextT=0,step=0,theme='main',started=false;
  const cfg={sfx:1,bgm:1}; // Shared festival mute is applied to every output bus.
  const keep=()=>{try{localStorage.setItem('fz-audio',JSON.stringify(cfg))}catch(e){}};
  const hz=n=>440*Math.pow(2,(n-69)/12);
  function init(){if(ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;

    sfxBus=ctx.createGain();sfxBus.gain.value=.4;sfxBus.connect(master);bgmBus=ctx.createGain();bgmBus.gain.value=0;bgmBus.connect(master);return true}
  function note(bus,f,t,dur,{type='sine',vol=.3,a=.005,slide=0,dec=null}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+(dec||dur));o.connect(g);g.connect(bus);o.start(t);o.stop(t+(dec||dur)+.05)}
  const bell=(bus,n,t,vol=.2,len=1.1)=>{note(bus,hz(n),t,len,{vol,dec:len});note(bus,hz(n)*2,t,len*.5,{vol:vol*.25,dec:len*.5});note(bus,hz(n)*3.01,t,len*.25,{type:'triangle',vol:vol*.08,dec:len*.25})};
  const SFX={
    tap:t=>note(sfxBus,1250,t,.05,{type:'triangle',vol:.08}),
    coin:t=>{note(sfxBus,hz(83),t,.09,{type:'square',vol:.09});note(sfxBus,hz(88),t+.08,.35,{type:'square',vol:.09})},
    correct:t=>[72,76,79,84].forEach((n,i)=>bell(sfxBus,n,t+i*.07,.22,.5)),
    wrong:t=>{note(sfxBus,220,t,.28,{type:'sawtooth',vol:.07,slide:.7});note(sfxBus,164,t+.12,.3,{type:'sawtooth',vol:.06,slide:.7})},
    magic:t=>{[72,76,79,83,86,88,91,96].forEach((n,i)=>bell(sfxBus,n,t+i*.055,.14,.7));note(sfxBus,300,t,.6,{type:'sine',vol:.08,slide:4})},
    levelup:t=>{[[72,0],[76,.12],[79,.24],[84,.36],[79,.52],[84,.62]].forEach(([n,d])=>{bell(sfxBus,n,t+d,.2,.6);note(sfxBus,hz(n-12),t+d,.25,{type:'triangle',vol:.06})})},
    win:t=>[67,72,76,79].forEach((n,i)=>bell(sfxBus,n,t+i*.1,.2,.8)),
    flip:t=>note(sfxBus,700,t,.07,{type:'triangle',vol:.1,slide:1.6}),
    pair:t=>{bell(sfxBus,84,t,.18,.4);bell(sfxBus,88,t+.08,.18,.5)},
    dice:t=>{for(let i=0;i<7;i++)note(sfxBus,300+Math.random()*500,t+i*.07,.04,{type:'square',vol:.05})},
    jackpot:t=>{for(let i=0;i<10;i++)bell(sfxBus,[72,76,79,84,88][i%5]+(i>4?12:0),t+i*.07,.15,.6)},
    open:t=>{note(sfxBus,hz(67),t,.12,{type:'triangle',vol:.1});note(sfxBus,hz(74),t+.07,.18,{type:'triangle',vol:.1})},
    spooky:t=>{note(sfxBus,330,t,.9,{type:'sine',vol:.1,slide:.5});note(sfxBus,415,t+.05,.9,{type:'sine',vol:.06,slide:.5})},
    zap:t=>{note(sfxBus,900,t,.18,{type:'sawtooth',vol:.06,slide:.2})}
  };
  function play(k){if(!cfg.sfx||!init())return;if(ctx.state!=='running')ctx.resume();const f=SFX[k];if(f)f(ctx.currentTime+.01)}
  /* 背景音樂：依平日／週日／節慶切換曲風 */
  const P=s=>s.replace(/\|/g,' ').trim().split(/\s+/).map(x=>x==='.'?null:+x);
  const I={C:[0,4,7],Am:[-3,0,4],F:[-7,-3,0],G:[-5,-1,2]};
  const TH={
    main:{bpm:116,root:60,beats:8,prog:[I.C,I.Am,I.F,I.G],scale:[0,2,4,5,7,9,11],arp:[0,2,1,2,3,2,1,2],lead:'bell',acc:'pluck',perc:'shaker',bass2:1,
      mel:[P('2 . 4 5 7 . 4 .|5 . 4 2 4 . . .|3 . 5 7 9 . 7 5|4 5 4 3 1 . . .'),P('2 4 7 . 9 . 7 .|8 7 5 . 4 . . .|3 . 5 . 4 3 2 .|1 2 . 1 0 . . .')]},

      mel:[P('4 . . 2 . 0|5 . . 4 . 2|3 . 5 . 7 .|6 . . 8 . .'),P('4 . . 5 . 4|2 . . 0 . 2|3 . . 5 . 3|1 . . 0 . .')]},
    festive:{bpm:132,root:67,beats:8,prog:[[0,4,7],[-5,-1,2],[-3,0,4],[-7,-3,0]],scale:[0,2,4,5,7,9,11],arp:[0,2,1,2,0,2,1,3],lead:'pluck',acc:'pluck',perc:'tick',bass2:1,
      mel:[P('2 . 4 . 7 . 4 .|1 . 6 . 8 . . .|0 . 2 . 5 . 4 .|5 . 4 . 3 . . .'),P('2 4 7 . 4 . 2 .|1 . 6 . 8 . 6 .|0 . 2 . 5 . 4 .|5 . 6 . 7 . . .')]},

      mel:[P('4 . 7 . 4 . 2 .|5 . 4 . 2 . 0 .|3 . 5 . 7 . 5 .|6 . 8 . 4 . . .'),P('4 . 7 . 9 . 8 .|7 . 5 . 4 . . .|3 . 5 . 4 . 2 .|4 . 3 . 1 . . .')]},
    xmas:{bpm:138,root:65,beats:8,prog:[[0,4,7],[5,9,12],[-5,-1,2],[0,4,7]],scale:[0,2,4,5,7,9,11],arp:[0,1,2,3,0,1,2,3],lead:'bell',acc:'bell',perc:'jingle',bass2:1,
      mel:[P('4 . 2 . 0 . 2 .|5 . 4 . 3 . 5 .|4 . 6 . 8 . 6 .|2 . . . 0 . . .'),P('4 . 4 . 5 . 4 .|3 . 5 . 7 . 5 .|4 . 1 . 2 . 6 .|7 . . . . . . .')]},
    chinese:{bpm:122,root:62,beats:8,prog:[[0,7,12],[-5,2,7],[-3,4,9],[0,7,12]],scale:[0,2,4,7,9],arp:[0,null,1,2,null,1,2,1],lead:'pluck',acc:'pluck',perc:'thump',
      mel:[P('3 . 4 . 5 . 4 3|2 . 3 . 2 1 0 .|1 . 2 . 3 . 5 4|3 . . . 2 . . .'),P('3 . 4 . 5 . 6 5|4 . 3 . 2 . 3 .|1 . 2 . 3 . 2 1|0 . . . . . . .')]},
    valentine:{bpm:100,perc:'shaker',root:63,beats:8,prog:[I.C,I.Am,I.F,I.G],scale:[0,2,4,5,7,9,11],arp:[0,1,2,3,2,1,2,1],lead:'flute',acc:'bell',
      mel:[P('4 . . 5 4 . 2 .|5 . . 4 2 . . .|3 . 5 . 7 . 6 .|4 . . . . . . .'),P('4 . . 5 7 . 5 .|4 . . 2 0 . . .|3 . 2 . 1 . 2 .|0 . . . . . . .')]}
  };
  TH.moon={...TH.chinese,bpm:96,lead:'flute',perc:'shaker'};TH.qixi={...TH.chinese,bpm:100,lead:'flute',acc:'bell',perc:'shaker'};
  TH.hwevent={...TH.halloween,bpm:138,bass2:1};
  /* 和弦設定：pad＝柔和長音和弦，seventh＝加七和弦更夢幻，strum＝節奏刷和弦 */
  Object.assign(TH.main,{pad:1,seventh:1,strum:'off'});Object.assign(TH.sunday,{pad:1,seventh:1});Object.assign(TH.valentine,{pad:1,seventh:1});
  Object.assign(TH.festive,{pad:1,strum:'beat'});Object.assign(TH.xmas,{pad:1,seventh:1,strum:'beat'});Object.assign(TH.chinese,{pad:1});
  Object.assign(TH.moon,{pad:1});Object.assign(TH.qixi,{pad:1});Object.assign(TH.halloween,{pad:1,strum:'off'});Object.assign(TH.hwevent,{pad:1,strum:'beat'});
  /* ===== 新增：各節慶專屬音樂（節慶一般＋節慶遊戲），全部原創旋律 ===== */
  const PEN=[0,2,4,7,9],MAJ=[0,2,4,5,7,9,11];
  const I4=[[0,4,7],[-7,-3,0],[-5,-1,2],[0,4,7]], I6=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]], I5=[[0,4,7],[-5,-1,2],[-3,0,4],[-7,-3,0]];
  Object.assign(TH,{
    newyear:{bpm:126,root:62,beats:8,prog:I4,scale:PEN,arp:[0,2,1,2,0,2,1,2],lead:'guzheng',acc:'pluck',perc:['gong','bigdrum','cymbal'],bass2:1,pad:1,strum:'beat',
      mel:[P('5 . 6 . 7 6 5 .|3 . 4 . 3 2 1 .|2 . 3 . 4 . 3 2|0 . . . 5 . . .'),P('7 . 7 6 5 . 6 .|8 . 7 . 6 5 . .|4 . 5 . 6 . 4 3|5 . . . . . . .')]},
    duanwu:{bpm:112,root:67,beats:8,prog:I6,scale:PEN,arp:[0,null,1,2,null,1,2,1],lead:'flute',acc:'guzheng',perc:['row'],pad:1,
      mel:[P('2 . 3 . 4 . . 3|2 . 1 . 0 . . .|1 . 2 . 3 . 4 .|3 . 2 . 1 . . .'),P('4 . 5 . 6 . 5 4|3 . 4 . 2 . . .|1 . 2 3 4 . 3 2|0 . . . . . . .')]},
    children:{bpm:138,root:60,beats:8,prog:I5,scale:MAJ,arp:[0,2,1,2,0,2,1,3],lead:'marimba',acc:'bell',perc:['clap','tick'],bass2:1,pad:1,strum:'beat',

    national:{bpm:116,root:58,beats:8,prog:I4,scale:MAJ,arp:[0,2,1,2,0,2,1,2],lead:'brass',acc:'pluck',perc:['march'],bass2:1,pad:1,strum:'beat',
      mel:[P('4 . . 4 5 . 6 .|7 . 6 . 5 . . .|5 . . 5 6 . 5 .|4 . 3 . 2 . . .'),P('4 . . 4 5 . 6 .|7 . 9 . 8 . 7 .|6 . 5 . 4 . 2 .|0 . . . . . . .')]},
    moon:{bpm:100,root:64,beats:8,prog:I6,scale:PEN,arp:[0,null,1,null,2,null,1,null],lead:'flute',acc:'bell',perc:'shaker',pad:1,seventh:1,

    xmasgame:{bpm:160,root:62,beats:8,prog:I4,scale:MAJ,arp:[0,1,2,1,0,1,2,3],lead:'bell',acc:'marimba',perc:['jingle','drive'],bass2:1,pad:1,strum:'beat',
      mel:[P('4 . 2 4 7 . 4 .|5 . 3 5 8 . 5 .|6 5 4 3 2 . 4 .|0 . 0 . 0 . . .'),P('7 . 7 6 5 . 4 .|8 . 7 6 5 . . .|4 5 6 . 6 5 4 2|0 . . . . . . .')]},
    newyeargame:{bpm:152,root:62,beats:8,prog:I4,scale:PEN,arp:[0,1,2,1,0,1,2,1],lead:'guzheng',acc:'pluck',perc:['gong','bigdrum','cymbal','drive'],bass2:1,pad:1,strum:'beat',
      mel:[P('5 6 7 . 5 6 7 .|8 7 6 5 3 . . .|3 4 5 . 3 4 5 .|6 5 4 3 2 . . .'),P('7 . 8 . 7 6 5 .|6 . 7 . 6 5 3 .|4 . 5 6 5 4 3 2|0 . . . 5 . . .')]},

      mel:[P('4 . 5 . 6 . 4 .|7 . 6 5 4 . . .|3 . 4 . 5 . 3 .|2 . 3 4 2 . . .'),P('7 . 8 . 9 . 7 .|8 . 7 6 5 . . .|4 . 6 5 4 2 1 .|0 . . . . . . .')]},
    moongame:{bpm:124,root:64,beats:8,prog:I6,scale:PEN,arp:[0,1,2,1,0,1,2,1],lead:'flute',acc:'guzheng',perc:['shaker','thump'],bass2:1,pad:1,strum:'off',
      mel:[P('3 . 5 . 4 3 2 .|3 . 2 . 1 . . .|2 . 4 . 3 2 1 .|2 . 1 . 0 . . .'),P('5 . 6 . 7 6 5 .|6 . 5 . 4 . . .|3 4 5 . 4 3 2 .|0 . . . . . . .')]},
    nationalgame:{bpm:138,root:58,beats:8,prog:I4,scale:MAJ,arp:[0,2,1,2,0,2,1,2],lead:'brass',acc:'pluck',perc:['march','drive'],bass2:1,pad:1,strum:'beat',
      mel:[P('4 . 4 4 5 . 6 .|7 . 7 7 6 . 5 .|4 . 4 4 5 . 6 .|5 . 4 . 2 . . .'),P('7 . 7 . 8 . 9 .|10 . 9 . 8 . 7 .|6 . 5 . 4 . 2 .|0 . . . . . . .')]}
  });
  function padChord(notes,t,dur){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;f.Q.value=.3;const gn=ctx.createGain();

}
function l2Draw(){
  const list=G.nians.filter(n=>n.st!=='gone').sort((a,b)=>a.z-b.z);
  for(const n of list){const p=nianPos(n),sh=n.hitT>0?Math.sin(n.hitT*80)*p.w*.04:0,bob=n.st==='run'?Math.abs(Math.sin(G.t*9+n.ph))*p.w*.04:0;
    ctx.save();ctx.globalAlpha=.25*(n.fa??1);ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(p.x,p.y,p.w*.4,p.w*.06,0,0,7);ctx.fill();ctx.restore();
    n.bb=dimg(n.img,p.x+sh,p.y-bob,p.w,{flip:n.flip,a:n.fa??1});
    if(n.hitT>0){ctx.save();ctx.globalAlpha=n.hitT*1.6;ctx.globalCompositeOperation='lighter';dimg(n.img,p.x+sh,p.y-bob,p.w,{flip:n.flip,a:.5});ctx.restore()}
    if(n.st==='run'){const bw=p.w*.6,bx=p.x-bw/2,by=n.bb.y-12;ctx.fillStyle='#0008';rr(bx,by,bw,7,4);ctx.fill();ctx.fillStyle=n.kind==='big'?'#ff4d4d':'#ffb400';rr(bx,by,bw*n.hp/n.max,7,4);ctx.fill()}
  }
  for(const pj of G.proj){const k=Math.min(1,pj.t/pj.d),x=pj.sx+(pj.tx-pj.sx)*k,y=pj.sy+(pj.ty-pj.sy)*k-Math.sin(k*Math.PI)*H*.08;
    dimg(IM.cracker_lit,x,y+W*.05,W*.06,{rot:k*9})}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

/* ---------- 粒子、煙火 ---------- */
function fxUpdate(dt){
  for(const p of G.P){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;if(p.rot!=null)p.rot+=dt*6}
  G.P=G.P.filter(p=>p.t<p.life);
  for(const r of G.rockets){r.t+=dt;if(!r.boom&&r.t>=r.d){r.boom=true;SFX.boom();const cs=[r.c,'#ffffff',pick(['#ffd23a','#ff5d8f','#7ee0ff','#b48bff'])];
      for(let i=0;i<70;i++){const a=i/70*Math.PI*2,sp=rnd(90,190);G.P.push({x:r.tx,y:r.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:60,life:rnd(1,1.5),t:0,r:rnd(1.8,3),k:'star',c:pick(cs)})}}}
  G.rockets=G.rockets.filter(r=>!r.boom);
  for(const f of G.flys)f.t+=dt;G.flys=G.flys.filter(f=>f.t<f.d);
}
function fxDraw(){
  for(const r of G.rockets){const k=r.t/r.d,x=r.x+(r.tx-r.x)*k,y=r.y+(r.ty-r.y)*(1-Math.pow(1-k,2));
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=r.c;for(let i=0;i<8;i++){ctx.globalAlpha=1-i/8;ctx.beginPath();ctx.arc(x-(r.tx-r.x)*.012*i,y+i*6,3-i*.3,0,7);ctx.fill()}ctx.restore()}
  for(const p of G.P){const a=1-p.t/p.life;ctx.save();
    if(p.k==='flash'){ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*(1+p.t*4));g.addColorStop(0,`rgba(255,240,180,${a})`);g.addColorStop(1,'rgba(255,120,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+p.t*4),0,7);ctx.fill()}
    else if(p.k==='paper'){ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2)}
    else if(p.k==='star'){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
    else if(p.k==='img'){ctx.restore();dimg(p.img,p.x,p.y,p.r*2,{a,rot:p.rot});continue}
    ctx.restore()}
  // 紅包飛向左上角
  for(const f of G.flys){if(f.t<0)continue;const k=f.t/f.d,tx=W*.12,ty=H*.035,x=f.x+(tx-f.x)*k*k,y=f.y+(ty-f.y)*k-Math.sin(k*Math.PI)*H*.06;
    dimg(IM.envelope,x,y+W*.03,W*.08*(1-k*.4),{a:1-k*.2,rot:k*2})}
}

/* ---------- 主迴圈 ---------- */
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(G&&!G.paused&&!G.over){G.t=G.lv===0?(performance.now()-G.startedAt)/1000:G.t+dt;if(G.shake>0)G.shake-=dt;if(G.lv===0)l1Update(dt);else if(G.lv===1)l2Update(dt);fxUpdate(dt)}
  ctx.clearRect(0,0,W,H);ctx.save();if(G&&G.shake>0)ctx.translate(rnd(-6,6),rnd(-4,4));
  const bg=G&&G.lv===1?IM.scene2:IM.scene1;if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,W,H);
  if(G){if(G.lv===0||G.lv===-1)l1Draw();if(G.lv===1)l2Draw();fxDraw()}
  ctx.restore();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- 操作 ---------- */
stage.addEventListener('pointerdown',e=>{if(!G||G.paused||G.over||e.target.closest('button,.panel'))return;const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(G.lv===0)l1Click(x,y);else if(G.lv===1)l2Click(x,y)});
function show(id){['startP','lvP','resP'].forEach(p=>$(p).hidden=p!==id);$('hud').hidden=!!id}
$('goBtn').onclick=()=>{newGame();show(null);startMusic();toast('點燃鞭炮和煙火，搶紅包！','#ffd23a')};
$('lvGo').onclick=()=>{G.lv=1;G.t=0;G.P=[];G.items=[];show(null);toast('丟鞭炮，把年獸趕跑！','#ffd23a')};
$('againBtn').onclick=$('goBtn').onclick;
$('homeBtn').onclick=()=>{G=null;show('startP')};
$('musBtn').onclick=()=>{SND.toggle('bgm');$('musBtn').style.opacity=SND.cfg.bgm?1:.45};
function startMusic(){SND.setTheme('newyeargame');SND.start()}
function endGame(){if(G.over)return;G.over=true;SND.stop();
  $('rEnv').textContent=G.env;$('r1').textContent=G.env1;$('r2').textContent=G.env2;
  const all=PRICE.look+PRICE.room;$('rPace').innerHTML=`照這一趟的速度，換齊新年套裝＋新春小屋（${all} 個）大約要 <b>${Math.ceil(all/G.env)} 趟</b>，每天 ${RUNS_PER_DAY} 趟約 <b>${Math.ceil(all/G.env/RUNS_PER_DAY)} 天</b>`;
  show('resP');SFX.bonus();if(window.FS_EMBED){fsReport(G.env);fsResult('againBtn','homeBtn')}}
show('startP');
window.__dbg={get G(){return G}};
})();

</script>

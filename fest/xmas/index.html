<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>聖誕滑雪橇</title>
<script src="questions.js"></script>
<script src="../common.js"></script><link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--ink:#3b2853;--muted:#6b5b7d;--rose:#e2508f;--green:#1d7a45;--red:#c0392b;--gold:#b7811a;--line:#e5d8f2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#cfe0f5;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,66.667dvh);height:min(150vw,100dvh);overflow:hidden;background:#eaf2fc;box-shadow:0 10px 40px -10px #2a4a7a66}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.disp{font-family:Huninn,"Noto Sans TC",sans-serif}
.hud{position:absolute;z-index:50;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:start;gap:8px;pointer-events:none}
.chip{background:#ffffffe6;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 6px #0002}
.chip img{width:20px;height:20px;object-fit:contain}
.hudR{display:flex;gap:6px}
.pause{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:0;background:#ffffffe6;color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px #0002}
.qbar{position:absolute;left:12px;right:12px;top:64px;background:#fffffff2;border-radius:16px;padding:10px 14px;box-shadow:0 4px 14px #0003;text-align:center;transition:opacity .25s,transform .25s}
.qbar.hide{opacity:0;transform:translateY(-10px);pointer-events:none}
.qbar .qt{font-size:12px;color:var(--muted)}
.qbar .qq{font-size:20px;margin:2px 0 6px}
.qbar .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qbar .opts span{background:#fff4e0;border:2px solid #e8c58a;border-radius:10px;padding:4px 2px;font-weight:700;font-size:15px}
.qbar .opts small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);font-size:30px;color:#fff;text-shadow:0 2px 0 #0004,0 0 12px #0005;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ctrl{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.ctrl button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:0;background:#ffffffcc;color:var(--ink);font-size:26px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px #0003}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:#1b2a4acc;overflow-y:auto}
.panel[hidden]{display:none}
.card{background:#fff;border-radius:22px;padding:18px 18px 16px;width:100%;max-width:380px;box-shadow:0 10px 30px #0004;display:flex;flex-direction:column;gap:12px}
.card h1{margin:0;font-size:28px;color:var(--green);text-align:center;font-weight:400}
.card h2{margin:0;font-size:15px;color:var(--ink)}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.tag{align-self:center;background:#fde6e3;color:var(--red);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{border:3px solid var(--line);background:#f7f3fb;border-radius:16px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink)}
.pick button img{height:96px;width:auto}
.pick.mode button{padding:10px 6px;gap:4px}.pick.mode small{font-size:12px;color:var(--muted);line-height:1.35}
.pick button[aria-pressed="true"]{border-color:var(--rose);background:#ffe1ee}
.set{display:grid;grid-template-columns:76px 1fr;gap:8px 10px;align-items:center;font-size:13px}
.seg{display:flex;gap:4px}
.seg button{flex:1;min-height:36px;border:2px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.go{height:54px;border:0;border-radius:999px;background:var(--rose);color:#fff;font-size:21px;cursor:pointer}
.sub{height:44px;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.res{background-size:cover;background-position:center}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:90px}
.gift{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:86px;background:#f7f3fb;border-radius:12px;padding:4px}
.gift img{max-height:56px;max-width:90%;transition:transform .2s}
.gift.shake img{animation:shake .35s}
.gift b{font-size:13px;color:var(--red);height:18px;display:flex;align-items:center;gap:2px}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
.total{display:flex;justify-content:space-around;text-align:center;background:#fff8e6;border-radius:14px;padding:10px}
.total div{display:flex;flex-direction:column}
.total span{font-size:12px;color:var(--muted)}
.total b{font-size:24px;color:var(--gold)}
.row{display:flex;gap:8px}.row>*{flex:1}
.note{font-size:11px;color:#8a7a9c;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="chip disp" id="timeChip">0:60</div>
    <div class="hudR" style="grid-column:3;justify-self:end">
      <div class="chip"><img src="img/gift_s.webp" alt="小禮物"><span id="cS">0</span></div>
      <div class="chip"><img src="img/gift_m.webp" alt="中禮物"><span id="cM">0</span></div>
      <div class="chip"><img src="img/gift_gold.webp" alt="金色大禮物"><span id="cG">0</span></div>
      <button class="pause" id="musBtn" aria-label="音樂開關">♪</button>
    </div>
  </div>
  <div class="qbar hide disp" id="qbar" aria-live="polite">
    <div class="qt" id="qt">答題閘門 1 / 2：滑進正確答案的門！</div>
    <div class="qq" id="qq"></div>
    <div class="opts" id="qo"></div>
  </div>
  <div class="toast disp" id="toast"></div>
  <div class="ctrl" id="ctrl" hidden>
    <button id="lb" aria-label="往左">◀</button>
    <button id="rb" aria-label="往右">▶</button>
  </div>

  <!-- 開始畫面 -->
  <div class="panel" id="startP">
    <div class="card">
      <span class="tag">試玩版・只有你看得到</span>
      <h1 class="disp">聖誕滑雪橇</h1>
      <p>左右滑動（或按 ◀ ▶、鍵盤方向鍵）換線道，閃開聖誕樹、雪人和石頭，接住禮物！看到題目時，滑進正確答案的門，就能拿到金色大禮物。禮物打開會得到<b>聖誕襪</b>，可以換聖誕專屬造型（200 隻）和專屬小屋（300 隻）。完成一局另得 <b>10 隻聖誕襪</b>，中途離開不發獎。</p>
      <h2>選擇模式</h2>
      <div class="pick mode" id="modePick">
        <button data-m="0" aria-pressed="true"><b class="disp" style="font-size:18px;font-weight:400">一般版</b><small>速度中等・中禮物機率 25%<br>撞到不掉禮物</small></button>
        <button data-m="1" aria-pressed="false"><b class="disp" style="font-size:18px;font-weight:400">進階版</b><small>更快、禮物更多・中禮物機率 40%<br>撞到只掉落 1 個小禮物</small></button>
      </div>
<p>每趟固定 40 秒，途中有 2 次答題閘門。</p>
      <button class="go disp" id="goBtn">出發！</button>
      <p class="note">🎵 有背景音樂，建議戴耳機聽；右上角 ♪ 可以關掉。</p>
    </div>
  </div>


  <!-- 結算 -->
  <div class="panel res" id="resP" hidden>
    <div class="card">
      <h1 class="disp">滑雪完成！</h1>
      <p id="resLine" style="text-align:center"></p>
      <div class="gifts" id="gifts"></div>
      <div class="total">
        <div><span>這趟拿到聖誕襪</span><b class="disp" id="tStar">0</b></div>
      </div>
      <p id="pace" style="text-align:center"></p>
      <div class="row">
        <button class="sub" id="skipBtn">全部打開</button>
        <button class="go disp" id="againBtn">再滑一次</button>
      </div>
      <button class="sub" id="homeBtn">回到開始畫面</button>
    </div>
  </div>
</div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
const IM={};['bg_slope','sled_f','sled_m','tree','snowman','rock','gift_s','gift_m','gift_gold','gift_open','gate'].forEach(k=>{const i=new Image();i.src='img/'+k+'.webp';IM[k]=i});
$('resP').style.backgroundImage='linear-gradient(#1b2a4a99,#1b2a4a99),url(img/room_xmas.webp)';

/* ---------- 設定 ---------- */
const CFG={mode:0,dur:1,char:window.FS_CHAR||'f'};
const DUR=40;
// 一般版／進階版
const MODES=[
  {name:'一般版',speed:0.46,obs:1.15,double:0,gift:2.0,mChance:0.25,drop:false,bpm:152},
  {name:'進階版',speed:0.58,obs:0.85,double:0.35,gift:1.3,mChance:0.4,drop:true,bpm:172}];
const MD=()=>MODES[CFG.mode];
const REWARD={s:[1,1],m:[2,3],g:[4,6]};   // 打開禮物得到的聖誕襪
const PRICE={look:200,room:300};
const RUNS_PER_DAY=5;
const SOCK='<svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><path d="M14 4h14v16c0 6-3 10-9 13l-5 3c-4 2-8 0-9-3s0-6 3-8l6-4z" fill="#d63b3b"/><rect x="12" y="3" width="18" height="7" rx="3" fill="#fff" stroke="#e5d8f2"/><circle cx="13" cy="28" r="2" fill="#fff" opacity=".8"/><circle cx="20" cy="22" r="1.6" fill="#fff" opacity=".8"/></svg>';
document.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));CFG[seg.dataset.k]=+b.dataset.v}));
$('modePick').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('modePick').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));CFG.mode=+b.dataset.m});

/* ---------- 只使用聖誕節專屬題庫 ---------- */
const QS=window.XMAS_QUESTIONS;
window.fsQuestionsReady=Array.isArray(QS)&&QS.length>=2&&QS.every(q=>
  Array.isArray(q)&&q.length===3&&typeof q[0]==='string'&&q[0].trim()&&
  Array.isArray(q[1])&&q[1].length===3&&q[1].every(a=>typeof a==='string'&&a.trim())&&
  new Set(q[1]).size===3&&Number.isInteger(q[2])&&q[2]>=0&&q[2]<3
);
if(!window.fsQuestionsReady){
  $('goBtn').disabled=true;
  $('goBtn').textContent='題庫無法使用';
  const error=document.createElement('p');error.setAttribute('role','alert');
  error.textContent='聖誕節題庫載入失敗、格式錯誤或不足兩題，請重新整理後再試。尚未扣除遊玩次數。';
  $('goBtn').before(error);
}

/* ---------- 透視與畫面座標 ---------- */
let W=0,H=0,DPR=1;
function resize(){const r=stage.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener('resize',resize);resize();
const H0=0.13,PY=0.835;               // 地平線與玩家所在高度（畫面比例）
const ZP=Math.sqrt((PY-H0)/(1-H0));   // 玩家所在深度
const yF=z=>H0+(1-H0)*z*z;
const roadL=yf=>{const t=(yf-H0)/(1-H0);return 0.40+(0.17-0.40)*t};
const roadR=yf=>{const t=(yf-H0)/(1-H0);return 0.60+(0.83-0.60)*t};
const laneX=(k,yf)=>{const L=roadL(yf),R=roadR(yf);return (L+(k+0.5)/3*(R-L))*W};
const laneW=yf=>(roadR(yf)-roadL(yf))/3*W;

/* ---------- 遊戲狀態 ---------- */
let G=null,raf=0,last=0;
function newGame(){
  const dur=DUR;
  const gates=[8,22];               // 第幾秒出題（出題 4 秒後閘門滑過來）
  const qs=shuffle(QS.slice()).slice(0,2);
  G={startedAt:performance.now(),fx:[],rush:false,t:0,dur,lane:1,px:1,objs:[],nextObs:1.2,nextGift:0.8,speedMul:1,hitT:0,inv:0,
     gates:gates.map((at,i)=>({at,q:qs[i],state:0,i})),cnt:{s:0,m:0,g:0},right:0,flakes:[],marks:[],paused:false,over:false,shake:0};
  for(let i=0;i<40;i++)G.flakes.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2.5,v:0.04+Math.random()*0.06});
  for(let i=0;i<14;i++)G.marks.push({z:Math.random(),k:Math.random()*3});
  ['cS','cM','cG'].forEach(id=>$(id).textContent='0');
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));

function gateBusy(t){return G.gates.some(g=>t>g.at-1.5&&t<g.at+7.5)}  // 閘門前後不放障礙物
function spawn(dt){
  const busy=gateBusy(G.t);
  G.nextObs-=dt;G.nextGift-=dt;
  if(G.nextObs<=0){
    G.nextObs=MD().obs*rnd(0.75,1.25);
    if(!busy){
      const n=Math.random()<MD().double?2:1;
      const lanes=shuffle([0,1,2]).slice(0,n);
      lanes.forEach(k=>G.objs.push({type:['tree','snowman','rock'][rint(0,2)],k,z:0,done:false}));
      G.nextGift=Math.max(G.nextGift,0.35);
    }
  }
  if(G.nextGift<=0){
    G.nextGift=MD().gift*rnd(0.75,1.25);
    if(!busy){
      const used=G.objs.filter(o=>o.z<0.12).map(o=>o.k);
      const free=[0,1,2].filter(k=>!used.includes(k));
      if(free.length){const k=free[rint(0,free.length-1)];G.objs.push({type:Math.random()<MD().mChance?'gift_m':'gift_s',k,z:0,done:false})}
    }
  }
}
function gateTick(){ // 答題閘門：先出題 4 秒，再讓閘門滑過來
  for(const g of G.gates){
    if(g.state===0&&G.t>=g.at){g.state=1;showQ(g)}
    if(g.state===1&&G.t>=g.at+4){g.state=2;G.objs.push({type:'gate',z:0,done:false,g})}
  }
}
function showQ(g){
  $('qt').textContent=`答題閘門 ${g.i+1} / 2：滑進正確答案的門！`;
  $('qq').textContent=g.q[0];
  $('qo').innerHTML=g.q[1].map((a,i)=>`<span><small>${['左','中','右'][i]}</small>${a}</span>`).join('');
  $('qbar').classList.remove('hide');
}
function toast(txt,color){const t=$('toast');t.textContent=txt;t.style.color=color||'#fff';t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),900)}

/* ---------- 聖誕滑雪橇 遊戲音樂（程式即時產生，原創旋律） ---------- */
const MUSIC=(()=>{
  let ac=null,out=null,rev=null,dry=null,on=true,playing=false,timer=0,nextT=0,step=0;
  let SD=60/152/2;               // 一格 = 八分音符
  const mid=n=>440*Math.pow(2,(n-69)/12);
  // 旋律：以 D5(74) 為 0 的半音數；'-' 延長；null 休止。A 段 8 小節 + B 段 8 小節
  const MEL=[
   [7,'-',4,'-',7,9,7,4],[5,'-',9,'-',12,'-',9,5],[2,4,5,7,9,'-',7,'-'],[4,'-',0,'-',0,'-','-',null],
   [9,'-',7,'-',4,'-',0,'-'],[5,7,9,12,9,'-',5,'-'],[7,'-',11,'-',14,'-',11,'-'],[12,'-','-','-',7,4,0,null],
   [9,'-',9,'-',9,7,5,'-'],[7,'-',4,7,12,'-','-',null],[5,'-',2,'-',5,9,14,'-'],[11,'-',9,'-',7,'-','-',null],
   [9,12,9,5,7,'-',4,'-'],[4,7,12,7,4,'-',0,'-'],[2,'-',4,'-',5,'-',-1,'-'],[0,'-','-','-',null,null,null,null]];
  const D=[0,4,7],G=[5,9,12],A=[7,11,14],Bm=[-3,0,4],Em=[2,5,9];
  const CH=[D,G,A,D,Bm,G,A,D, G,D,Em,A,G,D,A,D];
  const ROOT={0:0,5:5,7:7,'-3':-3,2:2};
  function init(){
    if(ac)return;
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(FSGame.output(ac));
    out=ac.createGain();out.gain.value=0.55;out.connect(comp);
    dry=ac.createGain();dry.gain.value=1;dry.connect(out);
    // 簡單殘響：用衰減的雜訊當空間
    rev=ac.createConvolver();const len=ac.sampleRate*1.6,ir=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
    rev.buffer=ir;const rg=ac.createGain();rg.gain.value=0.22;rev.connect(rg).connect(out);
  }
  function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec)}
  function panNode(p){const s=ac.createStereoPanner?ac.createStereoPanner():null;if(s){s.pan.value=p;s.connect(dry);s.connect(rev);return s}const g=ac.createGain();g.connect(dry);g.connect(rev);return g}
  // 鐘琴（FM 合成，像音樂盒／鐘聲）
  function bell(n,t,dur,vol,p){const o=panNode(p||0),c=ac.createOscillator(),m=ac.createOscillator(),mg=ac.createGain(),g=ac.createGain();
    c.frequency.value=mid(n);m.frequency.value=mid(n)*3.5;mg.gain.setValueAtTime(mid(n)*2.2,t);mg.gain.exponentialRampToValueAtTime(1,t+dur+0.6);
    m.connect(mg).connect(c.frequency);c.connect(g).connect(o);env(g,t,0.005,vol,dur+0.7);c.start(t);m.start(t);c.stop(t+dur+0.8);m.stop(t+dur+0.8)}
  // 木琴（短促）
  function mallet(n,t,vol,p){const o=panNode(p||0),a=ac.createOscillator(),b=ac.createOscillator(),g=ac.createGain();a.type='sine';b.type='triangle';
    a.frequency.value=mid(n);b.frequency.value=mid(n)*4;const gb=ac.createGain();gb.gain.value=0.15;b.connect(gb).connect(g);a.connect(g);g.connect(o);
    env(g,t,0.003,vol,0.22);a.start(t);b.start(t);a.stop(t+0.3);b.stop(t+0.3)}
  // 低音
  function bass(n,t,dur,vol){const o=panNode(0),a=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();a.type='triangle';a.frequency.value=mid(n);
    f.type='lowpass';f.frequency.value=600;a.connect(f).connect(g).connect(o);env(g,t,0.01,vol,dur);a.start(t);a.stop(t+dur+0.05)}
  // 柔和和弦墊底
  function pad(ns,t,dur,vol){const o=panNode(0),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;f.connect(o);
    ns.forEach((n,i)=>{[-6,6].forEach(dt=>{const a=ac.createOscillator(),g=ac.createGain();a.type='sawtooth';a.frequency.value=mid(n);a.detune.value=dt;
      a.connect(g).connect(f);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.15);g.gain.setValueAtTime(vol,t+dur-0.1);g.gain.linearRampToValueAtTime(0.0001,t+dur);a.start(t);a.stop(t+dur+0.05)})})}
  let noiseBuf=null;
  function noise(t,dur,vol,freq,q,p){if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),o=panNode(p||0);s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
    s.connect(f).connect(g).connect(o);env(g,t,0.002,vol,dur);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05)}
  const sleigh=(t,v,p)=>{noise(t,0.07,v,9000,1.2,p);noise(t+0.012,0.06,v*0.7,7000,2,-p)};
  function kick(t,v){const o=panNode(0),a=ac.createOscillator(),g=ac.createGain();a.frequency.setValueAtTime(150,t);a.frequency.exponentialRampToValueAtTime(45,t+0.12);a.connect(g).connect(o);env(g,t,0.002,v,0.18);a.start(t);a.stop(t+0.25)}
  const snare=(t,v)=>noise(t,0.12,v,2500,0.8,0);
  function tick(){
    while(nextT<ac.currentTime+0.15){
      const bar=Math.floor(step/8)%16,s=step%8,t=nextT,ch=CH[bar];
      const m=MEL[bar][s];
      if(typeof m==='number'){let len=1;while(s+len<8&&MEL[bar][s+len]==='-')len++;bell(74+m,t,SD*len,0.16,0.1)}
      // 木琴琶音（八分音符）
      const ap=[0,1,2,1,0,1,2,1][s];mallet(62+ch[ap],t,0.07,-0.25);
      // 低音：每拍
      if(s%2===0)bass(38+ch[0]+(ch[0]>7?-12:0)+(s===4?7:0),t,SD*1.6,0.22);
      if(s===0)pad(ch.map(x=>62+x),t,SD*8,0.012);
      // 節奏：雪橇鈴每個八分音符，重拍加大
      sleigh(t,s%2?0.05:0.09,0.3);if(s%2)sleigh(t+SD/2,0.03,-0.3);
      if(s===0||s===4)kick(t,0.35);if(s===2||s===6)snare(t,0.09);
      nextT+=SD;step++;
    }
  }
  function tempo(b){SD=60/b/2}
  function start(){if(!on)return;try{init();ac.resume();if(playing)return;playing=true;step=0;nextT=ac.currentTime+0.08;clearInterval(timer);timer=setInterval(tick,40);tick()}catch(e){}}
  function stop(){playing=false;clearInterval(timer)}
  function jingle(){if(!on)return;try{init();ac.resume();const t=ac.currentTime+0.05;[0,4,7,12,16,19,24].forEach((x,i)=>bell(74+x,t+i*0.09,0.25,0.14,(i%2?0.3:-0.3)));sleigh(t,0.1,0)}catch(e){}}
  return {start,stop,jingle,tempo,toggle(){on=!on;if(!on)stop();return on},get on(){return on}};
})();

/* ---------- 音效（簡單嗶聲） ---------- */
let AC=null;
function beep(f,d,type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(g).connect(FSGame.output(AC));o.start();o.stop(AC.currentTime+d)}catch(e){}}

function update(dt){
  G.t=(performance.now()-G.startedAt)/1000;if(G.t>=G.dur){$('timeChip').textContent='0 秒';endGame();return}
  // The fixed deadline controls completion, including background tabs.
  if(!G.finSpawned&&G.t>=G.dur-2.4){G.finSpawned=true;G.objs.push({type:'finish',z:0,done:false})}
  G.speedMul+=(1-G.speedMul)*Math.min(1,dt*1.5);
  G.inv=Math.max(0,G.inv-dt);G.shake=Math.max(0,G.shake-dt);
  const v=MD().speed*G.speedMul;
  if(!G.rush&&G.dur-G.t<=10){G.rush=true;MUSIC.tempo(MD().bpm+10)}
  if(G.t<G.dur-3.5)spawn(dt*G.speedMul);gateTick();
  G.px+=(G.lane-G.px)*Math.min(1,dt*14);
  for(const o of G.objs){
    if(o.fly>0){o.fly=Math.max(0,o.fly-dt);continue}
    o.z+=v*dt*(0.55+0.45*o.z);  // 越近越快，增加速度感
    if(!o.done&&o.z>=ZP-0.015){
      o.done=true;
      const pl=Math.round(G.px);
      if(o.type==='finish'){G.finished=true;toast('抵達終點！','#ffe27a');continue}
      if(o.type==='gate'){
        const g=o.g;
        if(pl===g.q[2]){G.cnt.g++;G.right++;$('cG').textContent=G.cnt.g;toast('答對了！金色大禮物','#ffe27a');beep(880,.15);setTimeout(()=>beep(1320,.2),120)}
        else{toast('答案是「'+g.q[1][g.q[2]]+'」','#ffffff');beep(220,.25,'triangle')}
        $('qbar').classList.add('hide');
      }else if(o.k===pl){
        if(o.type.startsWith('gift')){
          o.got=true;
          if(o.type==='gift_s'){G.cnt.s++;$('cS').textContent=G.cnt.s}else{G.cnt.m++;$('cM').textContent=G.cnt.m}
          beep(o.type==='gift_s'?660:990,.12);
        }else if(G.inv<=0){
          G.speedMul=0.45;G.inv=1.0;G.shake=0.4;beep(140,.25,'square');
          if(MD().drop&&G.cnt.s>0){
            G.cnt.s--;$('cS').textContent=G.cnt.s;
            // 禮物飛走消失（不能撿回）
            const L=roadL(PY),R=roadR(PY);
            G.fx.push({x:(L+(G.px+0.5)/3*(R-L))*W,y:PY*H-laneW(PY)*0.6,t:0,dir:Math.random()<0.5?-1:1});
            toast('禮物飛走了！','#ffd0d0');
          }else toast('哎呀！');
        }
      }
    }
  }
  G.objs=G.objs.filter(o=>o.z<1.05&&!o.got);
  for(const f of G.fx)f.t+=dt;G.fx=G.fx.filter(f=>f.t<1.1);
  for(const m of G.marks){m.z+=v*dt*(0.55+0.45*m.z);if(m.z>1){m.z=0;m.k=Math.random()*3}}
  for(const f of G.flakes){f.y+=f.v*dt;f.x+=Math.sin((G.t+f.y*10))*0.0006;if(f.y>1){f.y=0;f.x=Math.random()}}
  const left=Math.max(0,Math.ceil(G.dur-G.t));$('timeChip').textContent=`${left} 秒`;
}

function drawImg(img,cx,by,w){ // 以底部中心定位
  if(!img.complete||!img.naturalWidth)return;
  const h=w*img.naturalHeight/img.naturalWidth;ctx.drawImage(img,cx-w/2,by-h,w,h);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const sx=G&&G.shake>0?(Math.random()-0.5)*8:0;
  ctx.save();ctx.translate(sx,0);
  const bg=IM.bg_slope;if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,W,H);
  if(G){
    // 雪地上的流動痕跡（速度感）
    ctx.fillStyle='rgba(150,180,220,0.35)';
    for(const m of G.marks){const yf=yF(m.z),L=roadL(yf),R=roadR(yf);const x=(L+(m.k/3)*(R-L))*W,y=yf*H,s=(R-L)*W/60;ctx.beginPath();ctx.ellipse(x,y,s*1.4,s*0.35,0,0,Math.PI*2);ctx.fill()}
    // 物件依遠近排序
    const list=G.objs.slice().sort((a,b)=>a.z-b.z);
    let playerDrawn=false;
    const drawPlayer=()=>{
      const yf=PY,lw=laneW(yf);
      const L=roadL(yf),R=roadR(yf),x=(L+(G.px+0.5)/3*(R-L))*W;
      const bob=Math.sin(G.t*12)*2;
      ctx.globalAlpha=G.inv>0&&Math.floor(G.t*12)%2?0.45:1;
      ctx.fillStyle='rgba(60,90,140,0.18)';ctx.beginPath();ctx.ellipse(x,yf*H+4,lw*0.45,lw*0.1,0,0,Math.PI*2);ctx.fill();
      drawImg(CFG.char==='f'?IM.sled_f:IM.sled_m,x,yf*H+6+bob,lw*1.05);
      ctx.globalAlpha=1;playerDrawn=true;
    };
    for(const o of list){
      if(!playerDrawn&&o.z>ZP)drawPlayer();
      const yf=yF(o.z),y=yf*H,lw=laneW(yf);
      if(o.type==='finish'){
        const L=roadL(yf)*W,R=roadR(yf)*W,gw=(R-L)*1.18;
        drawImg(IM.gate,(L+R)/2,y,gw);
        const fs=Math.max(9,lw*0.28),bw=(R-L)*0.7,bh=fs*1.8,by=y-gw*0.65*0.42;
        ctx.fillStyle='#c0392b';roundRect((L+R)/2-bw/2,by-bh/2,bw,bh,bh*0.3);ctx.fill();
        ctx.fillStyle='#fff';ctx.font=`700 ${fs}px "Noto Sans TC",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('終點 FINISH',(L+R)/2,by);
        continue;
      }
      if(o.type==='gate'){
        const L=roadL(yf)*W,R=roadR(yf)*W,gw=(R-L)*1.18;
        drawImg(IM.gate,(L+R)/2,y,gw);
        const g=o.g;const fs=Math.max(8,lw*0.2);
        for(let k=0;k<3;k++){
          const x=laneX(k,yf),py=y-gw*0.62*0.38,pw=lw*0.86,ph=fs*1.9;
          ctx.fillStyle='#fff6e2';ctx.strokeStyle='#8a5a2b';ctx.lineWidth=Math.max(1.5,lw*0.03);
          roundRect(x-pw/2,py-ph/2,pw,ph,ph*0.3);ctx.fill();ctx.stroke();
          ctx.fillStyle='#5a3a1a';ctx.font=`700 ${fs}px "Noto Sans TC",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
          fitText(g.q[1][k],x,py,pw*0.92,fs);
        }
      }else{
        const isGift=o.type.startsWith('gift');
        const sz=lw*(o.type==='tree'?0.8:o.type==='snowman'?0.78:o.type==='rock'?0.85:o.type==='gift_m'?0.55:0.42);
        ctx.fillStyle='rgba(60,90,140,0.16)';ctx.beginPath();ctx.ellipse(laneX(o.k,yf),y,sz*0.45,sz*0.1,0,0,Math.PI*2);ctx.fill();
        let gx=laneX(o.k,yf),gy=y+(isGift?-Math.abs(Math.sin(G.t*5+o.k))*lw*0.06:0);
        if(o.fly>0){const p=1-o.fly/0.6;gx=laneX(o.from,yf)+(gx-laneX(o.from,yf))*p;gy-=Math.sin(p*Math.PI)*lw*1.2}
        drawImg(IM[o.type==='tree'?'tree':o.type],gx,gy,sz);
      }
    }
    if(!playerDrawn)drawPlayer();
    // 飛走的禮物：往上飛、旋轉、變小、淡出
    for(const f of G.fx){
      const p=f.t/1.1,img=IM.gift_s;if(!img.naturalWidth)continue;
      const lw=laneW(PY),sz=lw*0.42*(1-p*0.6),x=f.x+f.dir*p*lw*1.6,y=f.y-p*H*0.35-Math.sin(p*Math.PI)*lw*0.5;
      ctx.save();ctx.globalAlpha=1-p;ctx.translate(x,y);ctx.rotate(f.dir*p*6);
      const h=sz*img.naturalHeight/img.naturalWidth;ctx.drawImage(img,-sz/2,-h/2,sz,h);ctx.restore();
    }
    // 飄雪
    ctx.fillStyle='rgba(255,255,255,0.9)';
    for(const f of G.flakes){ctx.beginPath();ctx.arc(f.x*W,f.y*H,f.r,0,Math.PI*2);ctx.fill()}
  }
  ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function fitText(t,x,y,maxW,fs){let s=fs;ctx.font=`700 ${s}px "Noto Sans TC",sans-serif`;while(ctx.measureText(t).width>maxW&&s>7){s-=1;ctx.font=`700 ${s}px "Noto Sans TC",sans-serif`}ctx.fillText(t,x,y)}

function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(G&&!G.paused&&!G.over)update(dt);
  draw();
  raf=requestAnimationFrame(loop);
}

/* ---------- 操作 ---------- */
function move(d){if(!G||G.paused||G.over)return;const n=Math.max(0,Math.min(2,G.lane+d));if(n!==G.lane){G.lane=n;beep(520,.05)}}
$('lb').addEventListener('click',()=>move(-1));$('rb').addEventListener('click',()=>move(1));
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1)});
let tx=null,ty=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,.panel'))return;tx=e.clientX;ty=e.clientY});
stage.addEventListener('pointerup',e=>{if(tx===null)return;const dx=e.clientX-tx,dy=e.clientY-ty;
  if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);
  else if(Math.abs(dx)<10&&Math.abs(dy)<10){const r=stage.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)}
  tx=null});

/* ---------- 畫面切換 ---------- */
function show(id){['startP','resP'].forEach(p=>$(p).hidden=p!==id);const playing=!id;$('hud').hidden=!playing;$('ctrl').hidden=!playing}
function start(){newGame();show(null);MUSIC.tempo(MD().bpm);MUSIC.start();toast('出發！','#ffe27a');beep(660,.1);setTimeout(()=>beep(990,.15),100)}
$('goBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);
$('homeBtn').addEventListener('click',()=>{G=null;$('qbar').classList.add('hide');show('startP')});
$('musBtn').addEventListener('click',()=>{const o=MUSIC.toggle();$('musBtn').style.opacity=o?1:.45;if(o&&G&&!G.paused&&!G.over)MUSIC.start()});

/* ---------- 結算：禮物一個一個打開 ---------- */
let openTimer=null;
function pace(total){
  const all=PRICE.look+PRICE.room;
  $('pace').innerHTML=total?`照這趟的速度，換齊造型＋小屋（${all} 隻）大約要 <b>${Math.ceil(all/total)} 趟</b>，每天 ${RUNS_PER_DAY} 趟約 <b>${Math.ceil(all/total/RUNS_PER_DAY)} 天</b>`:'';
}
function endGame(){
  G.over=true;$('qbar').classList.add('hide');MUSIC.stop();MUSIC.jingle();
  const list=[];for(let i=0;i<G.cnt.g;i++)list.push('g');for(let i=0;i<G.cnt.m;i++)list.push('m');for(let i=0;i<G.cnt.s;i++)list.push('s');
  const img={s:'gift_s',m:'gift_m',g:'gift_gold'};
  $('gifts').innerHTML=list.length?list.map((t,i)=>`<div class="gift" data-t="${t}" id="gf${i}"><img src="img/${img[t]}.webp" alt=""><b></b></div>`).join(''):'<p style="grid-column:1/-1;text-align:center">這趟沒有拿到禮物，再試一次吧！</p>';
  $('resLine').textContent=`${MD().name}・答對 ${G.right} / 2 題・小禮物 ${G.cnt.s}・中禮物 ${G.cnt.m}・金色大禮物 ${G.cnt.g}`;
  $('tStar').textContent='0';$('pace').textContent='';
  show('resP');
  const rewards=list.map(t=>{const [a,b]=REWARD[t];return rint(a,b)});const giftTotal=rewards.reduce((a,b)=>a+b,0),completionBonus=10,sum=giftTotal+completionBonus;$('tStar').textContent=sum;$('resLine').textContent+=`・禮物 ${giftTotal} 隻＋完成獎勵 ${completionBonus} 隻`;fsReport(sum);fsResult('againBtn','homeBtn');
  let i=0,total=0;
  const openOne=()=>{
    const el=$('gf'+i);if(!el){clearInterval(openTimer);openTimer=null;return}
    const t=el.dataset.t,[a,b]=REWARD[t];let n=rewards[i];total+=n;
    el.classList.add('shake');
    setTimeout(()=>{el.querySelector('img').src='img/gift_open.webp';el.querySelector('b').innerHTML=SOCK.replace('30','16').replace('30','16')+'×'+n;$('tStar').textContent=sum;if(!$('gf'+i))pace(total)},180);
    beep(t==='g'?1180:t==='m'?880:700,.12);i++;
  };
  clearInterval(openTimer);openTimer=setInterval(openOne,550);
  $('skipBtn').onclick=()=>{clearInterval(openTimer);while($('gf'+i)){const el=$('gf'+i),[a,b]=REWARD[el.dataset.t];let n=rewards[i];total+=n;el.querySelector('img').src='img/gift_open.webp';el.querySelector('b').innerHTML=SOCK.replace('30','16').replace('30','16')+'×'+n;i++}$('tStar').textContent=sum;pace(total)};
  if(!list.length)pace(0);
}

show('startP');
requestAnimationFrame(loop);
})();
</script>

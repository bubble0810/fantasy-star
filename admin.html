<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>幻想智慧星・管理後台</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="nickname.js?v=20261110-home1"></script>
<script src="festival-config.js?v=20261111-national1"></script>
<script src="leaderboard.js?v=20261111-rank-metrics1"></script>
<link rel="stylesheet" href="home-ui.css?v=20261111-rank-metrics1">
<style>
:root{--ink:#2e2340;--muted:#6b5b7d;--line:#e3d9ef;--bg:#f6f2fb;--accent:#c23258;--ok:#1f7a45;--warn:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;color:var(--accent)}
nav{display:flex;gap:4px}
nav button,.btn{min-height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;font:inherit;color:var(--ink);cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.danger{color:var(--warn);border-color:#f1c4c0}
.btn:disabled{opacity:.5}
.who{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
main{padding:16px;max-width:1400px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(0,1.4fr);gap:16px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:16px}
.card h3{margin:6px 0 0;font-size:14px;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
textarea{width:100%;min-height:80px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
tbody tr{cursor:pointer}tbody tr:hover{background:#faf6ff}tbody tr.sel{background:#f1e8ff}
.tablewrap{overflow-x:auto;max-height:70vh;overflow-y:auto}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center}
.kv span{color:var(--muted)}
.pw{font-size:22px;letter-spacing:4px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 8px;background:#eee}
.tag.on{background:#e3f6ea;color:var(--ok)}.tag.off{background:#fde8e6;color:var(--warn)}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-height:340px;overflow-y:auto}
.looks label{border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:11px;text-align:center;gap:2px;cursor:pointer}
.looks label.own{border-color:var(--accent);background:#fff2f6}
.looks img{height:60px;width:auto}
.homes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.homes label{border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;gap:6px;align-items:center;font-size:12px;cursor:pointer}
.homes label.own{border-color:var(--accent);background:#fff2f6}
.homes img{width:48px;height:32px;object-fit:cover;border-radius:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card>label{display:flex;flex-direction:column;gap:4px;font-weight:700}.card>label small{font-weight:400;color:var(--muted)}
.seg{gap:6px}.seg .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.picks{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.picks label{display:flex;gap:6px;align-items:center;font-weight:400}.picks small{color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:13px}.boxinfo{background:#f6f0ff;border-radius:10px;padding:10px;font-size:13px;line-height:1.7}
.tag a{color:var(--warn);text-decoration:none;margin-left:2px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.nums label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.mail{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.mail small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:20}
.login{max-width:380px;margin:12vh auto}
.login input{width:100%}
.stage{display:flex;gap:10px;align-items:flex-end}
.stage img{height:150px;width:auto}
details summary{cursor:pointer;font-weight:700}
.sub{display:flex;gap:4px;flex-wrap:wrap}.sub button{min-height:34px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;font:inherit;cursor:pointer}
.sub button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi small{color:var(--muted);display:block}.kpi b{font-size:24px}
.bar{height:12px;border-radius:6px;background:#e2508f;min-width:2px}.bar.b2{background:#8a7dff}
td.barc{width:40%;min-width:120px}
.days{display:flex;align-items:flex-end;gap:3px;height:160px;border-bottom:1px solid var(--line);padding-top:10px}
.days>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%;font-size:10px;color:var(--muted)}
.days i{display:block;width:100%;background:#e2508f;border-radius:4px 4px 0 0;min-height:1px}.days i.n{background:#8a7dff}
.thumb{height:36px;width:auto;vertical-align:middle;border-radius:4px}
.note{color:var(--muted);font-size:12px;margin:0}
</style>
</head>
<body>
<div id="app"><div class="login card"><h2>幻想智慧星・管理後台</h2><p id="boot">讀取中…</p></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s),app=$('#app');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
if(!window.CLOUD_GATE){app.innerHTML=`<div class="login card"><h2>還沒設定 Firebase</h2><p>請先把 Firebase 設定碼填進 <b>firebase-config.js</b>，再重新整理這一頁。</p></div>`;return}
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
let PETS=[],CATS=[],GAMEF=[],stSub='games',stRange=7;
let ME=null,PLAYERS=[],SEL=null,SELS=null,LOOKS=[],HOMES=[],tab='players',sortK='lastLogin',sortD=-1,q='';

/* 從遊戲檔讀出造型和小屋清單 */
async function loadCatalog(){
  try{const t=await (await fetch('index.html',{cache:'no-store'})).text();
    const m=t.match(/const LOOKS=(\[.*?\]\]);/s);if(m)LOOKS=JSON.parse(m[1]).filter(r=>!/B$/.test(r[0]));
    const hb=t.slice(t.indexOf('const HOMES=['),t.indexOf('];',t.indexOf('const HOMES=['))+2);
    HOMES=[...hb.matchAll(/\{id:'(\w+)',n:'([^']+)'[^}]*?img:'([^']+)'[^}]*\}/g)].map(x=>({id:x[1],n:x[2],img:x[3],fest:(x[0].match(/fest:'(\w+)'/)||[])[1]||''}));
    const pb=t.slice(t.indexOf('const PETS=['),t.indexOf('];',t.indexOf('const PETS=['))+2);
    PETS=[...pb.matchAll(/\{k:'(\w+)',n:'([^']+)',lv:(\d+),cost:(\d+)[^}]*?(hide:1)?[^}]*\}/g)].filter(x=>!/hide:1/.test(x[0])).map(x=>({k:x[1],n:x[2],cost:+x[4],img:(x[0].match(/img:'([^']+)'/)||[])[1]||''}));
    const cm=t.match(/const CATS=\[([\s\S]*?)\];/);if(cm)CATS=[...cm[1].matchAll(/k:'(\w+)',n:'([^']+)'/g)].map(x=>({k:x[1],n:x[2]}));
    if(!window.FESTIVAL_CATALOG)throw new Error('節慶設定未載入');
    GAMEF=Object.entries(window.FESTIVAL_CATALOG).filter(([,g])=>g.status==='ready').map(([k,g])=>({k,...g}));
  }catch(e){toast('讀不到遊戲清單，請確認 index.html 與 festival-config.js 已一起上傳')}
}
const fmt=ts=>ts&&ts.toDate?ts.toDate().toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const lvOf=exp=>{let l=1,t=0;while(true){const need=Math.min(100*l,600);if(exp<t+need)return l;t+=need;l++}};
const lvNeed=l=>Math.min(100*l,600);                       // 這一級升到下一級要多少
const lvBase=l=>{let t=0;for(let i=1;i<l;i++)t+=lvNeed(i);return t};   // 到達這一級的總經驗值
const lvInfo=exp=>{const l=lvOf(exp),b=lvBase(l);return {l,cur:exp-b,need:lvNeed(l)}};
async function log(action,target,detail){try{await db.collection('adminlog').add({at:FV.serverTimestamp(),admin:ME.email,action,target:target||'',detail:detail||''})}catch(e){console.error('adminlog',e);toast('操作已完成，但操作紀錄寫入失敗：'+(e.code||e.message))}}

/* ---------- 登入 ---------- */
function loginView(msg){
  app.innerHTML=`<form class="login card" id="lf"><h2>幻想智慧星・管理後台</h2>
  <label>管理員 Email<input id="le" type="email" autocomplete="username" required></label>
  <label>密碼<input id="lp" type="password" autocomplete="current-password" required></label>
  <p style="color:var(--warn);margin:0">${esc(msg||'')}</p><button class="btn primary">登入</button></form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value)}catch(er){loginView('登入失敗：'+(er.code||er.message))}};
}
auth.onAuthStateChanged(async u=>{
  if(!u)return loginView();
  const a=await db.doc('admins/'+u.uid).get().catch(()=>null);
  if(!a||!a.exists){app.innerHTML=`<div class="login card"><h2>這個帳號不是管理員</h2><p>請到 Firestore 建立 <b>admins/${esc(u.uid)}</b> 這份文件，再重新整理。</p><p style="font-size:12px;color:var(--muted)">你的 UID：${esc(u.uid)}</p><button class="btn" id="lo">登出</button></div>`;$('#lo').onclick=()=>auth.signOut();return}
  ME=u;await loadCatalog();shell();loadPlayers();
});

/* ---------- 外框 ---------- */
function shell(){
  app.innerHTML=`<header><h1>幻想智慧星・管理後台</h1><nav>
  <button data-t="players">玩家</button><button data-t="stat">📊 統計</button><button data-t="bc">🎁 送禮物</button><button data-t="leaderboard">🏆 星空榜</button><button data-t="log">操作紀錄</button></nav>
  <div class="who">${esc(ME.email)}<button class="btn" id="lo">登出</button></div></header><main id="main"></main>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;view()});
  $('#lo').onclick=()=>auth.signOut();view();
}
function view(){app.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
  if(tab==='players')playersView();else if(tab==='stat')statView();else if(tab==='bc')bcView();else if(tab==='leaderboard')leaderboardView();else logView()}

/* ---------- Administrator-only leaderboard review and publication ---------- */
let LB_ADMIN=null;
const lbTime=v=>v&&typeof v.toMillis==='function'?Math.floor(v.toMillis()):Number.isSafeInteger(v)?v:0;
const lbSameTimestamp=(a,b)=>a?.isEqual&&b?.toMillis?a.isEqual(b):lbTime(a)===lbTime(b);
const lbTaipeiInput=ms=>ms?new Date(ms+8*3600000).toISOString().slice(0,16):'';
const lbMetric=(type,v)=>type==='stroop'?v.score+' 分':type==='memory'?v.tries+' 次翻牌':type==='maze'?(v.durationMs/1000).toFixed(3)+' 秒':type==='quest'?v.cleared+' 關／'+v.stars+' 顆星':v.count+' 款造型與小屋';
const lbTimeText=ms=>ms?new Date(ms).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'—';
async function leaderboardView(){
  const owner=ME?.uid,m=$('#main');m.innerHTML='<div class="card"><h2>星空榜管理</h2><p>正在讀取設定…</p></div>';
  if(!window.FSLeaderboard){m.innerHTML='<div class="card">排行榜模組未載入，請確認 leaderboard.js 已上傳。</div>';return;}
  try{
    const [cfgSnap,pubSnap,playersSnap,eligSnap]=await Promise.all([db.doc('leaderboardConfig/current').get(),db.doc('leaderboardPublic/current').get(),db.collection('players').get(),db.collection('leaderboardEligibility').get()]);
    if(tab!=='leaderboard'||ME?.uid!==owner||auth.currentUser?.uid!==owner)return;
    const eligibility=new Map(eligSnap.docs.map(d=>[d.id,d.data()]));
    LB_ADMIN={owner,config:cfgSnap.exists?cfgSnap.data():{enabled:false,startsAt:0},published:pubSnap.exists?pubSnap.data():null,players:playersSnap.docs.map(d=>({uid:d.id,...d.data()})),eligibility,preview:null};
    const C=LB_ADMIN.config;
    m.innerHTML=`<div class="card"><h2>星空榜管理</h2><p>請先儲存設定，讀取成績預覽，再手動發布。玩家會看到上次發布的前三名。</p>
      <label style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px"><input style="width:18px;height:18px;min-height:18px;margin:0" type="checkbox" id="lbEnabled" ${C.enabled?'checked':''}> 開放排行榜</label>
      <label>起算時間（台灣時間；留空表示不限）<input type="datetime-local" id="lbStartsAt" value="${lbTaipeiInput(lbTime(C.startsAt))}"></label>
      <div class="row"><button class="btn" id="lbSave">儲存設定</button><button class="btn" id="lbPreview">讀取成績並預覽</button><button class="btn primary" id="lbPublish" disabled>發布排行榜</button></div>
      <p id="lbStatus" role="status">上次發布：${lbTimeText(lbTime(LB_ADMIN.published?.publishedAt))}</p><div id="lbPreviewArea"></div></div>
      <div class="card"><h2>資格與單項重置</h2><p>重置會保留歷史紀錄，只排除重置時間當下及之前的該項成績。變更後請重新預覽、發布。</p><div class="tablewrap"><table><thead><tr><th>玩家</th><th>資格</th><th>單項重置</th></tr></thead><tbody>${LB_ADMIN.players.map(p=>{const policy=eligibility.get(p.uid)||{};return `<tr><td>${esc(p.name)} · Lv.${lvOf(p.exp||0)}</td><td>${p.disabled?'帳號停用':`<button class="btn" data-lb-exclude="${esc(p.uid)}">${policy.excluded?'恢復資格':'排除資格'}</button>`}</td><td><select data-lb-type="${esc(p.uid)}">${Object.entries(FSLeaderboard.types).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><button class="btn" data-lb-reset="${esc(p.uid)}">重置此項</button></td></tr>`}).join('')}</tbody></table></div></div>`;
    $('#lbSave').onclick=lbSaveConfig;$('#lbPreview').onclick=lbPreview;$('#lbPublish').onclick=lbPublish;
    m.querySelectorAll('[data-lb-exclude]').forEach(b=>b.onclick=()=>lbEligibility(b.dataset.lbExclude,null));
    m.querySelectorAll('[data-lb-reset]').forEach(b=>b.onclick=()=>{const uid=b.dataset.lbReset,select=[...m.querySelectorAll('[data-lb-type]')].find(e=>e.dataset.lbType===uid);if(confirm('確定重置此玩家的這一項榜單資格？歷史成績會保留，需在重置後重新取得成績。'))lbEligibility(uid,select.value);});
  }catch(e){if(tab==='leaderboard')m.innerHTML=`<div class="card"><h2>星空榜管理</h2><p>無法讀取排行榜設定，請確認登入資格及新版資料庫規則。</p><p>${esc(e.code||e.message)}</p></div>`;}
}
function lbAssertOwner(){if(!LB_ADMIN||ME?.uid!==LB_ADMIN.owner||auth.currentUser?.uid!==LB_ADMIN.owner)throw new Error('管理員登入已變更，請重新開啟排行榜管理。');}
async function lbSaveConfig(){
  const button=$('#lbSave');button.disabled=true;
  try{lbAssertOwner();const input=$('#lbStartsAt').value,startsAt=input?Date.parse(input+'+08:00'):0;if(!Number.isSafeInteger(startsAt)||startsAt<0)throw new Error('請輸入有效的台灣時間');const config={schemaVersion:1,enabled:$('#lbEnabled').checked,startsAt,updatedAt:FV.serverTimestamp()};await db.doc('leaderboardConfig/current').set(config);await log('排行榜設定','全站',JSON.stringify({enabled:config.enabled,startsAt}));await leaderboardView();toast('已儲存設定，請重新預覽後發布');}catch(e){toast('設定未儲存：'+(e.code||e.message));}finally{if(button.isConnected)button.disabled=false;}
}
async function lbEligibility(uid,type){
  try{lbAssertOwner();const configRef=db.doc('leaderboardConfig/current'),policyRef=db.doc('leaderboardEligibility/'+uid);await db.runTransaction(async tx=>{const [cs,ps]=await Promise.all([tx.get(configRef),tx.get(policyRef)]),old=ps.exists?ps.data():{excluded:false,resetAt:{}},config=cs.exists?cs.data():{schemaVersion:1,enabled:false,startsAt:0};const resetAt={...(old.resetAt||{})};if(type)resetAt[type]=FV.serverTimestamp();tx.set(policyRef,{excluded:type?old.excluded===true:!old.excluded,resetAt,updatedAt:FV.serverTimestamp()});tx.set(configRef,{schemaVersion:1,enabled:config.enabled===true,startsAt:lbTime(config.startsAt),updatedAt:FV.serverTimestamp()});});await log(type?'排行榜單項重置':'排行榜資格',uid,type||'切換排除資格');await leaderboardView();toast('已更新，請重新預覽並發布');}catch(e){toast('變更失敗：'+(e.code||e.message));}
}
async function lbPreview(){
  const button=$('#lbPreview');button.disabled=true;$('#lbPublish').disabled=true;
  try{
    lbAssertOwner();$('#lbStatus').textContent='正在讀取完整成績歷史，請稍候…';
    const [cs,ps,es]=await Promise.all([db.doc('leaderboardConfig/current').get(),db.collection('players').get(),db.collection('leaderboardEligibility').get()]);if(!cs.exists)throw new Error('請先儲存排行榜設定');
    const config=cs.data(),eligibility=new Map(es.docs.map(d=>[d.id,d.data()])),players=ps.docs.map(d=>{const p=d.data(),e=eligibility.get(d.id)||{};return{uid:d.id,name:p.name||'玩家',level:lvOf(p.exp||0),disabled:p.disabled===true,excluded:e.excluded===true,resetAt:Object.fromEntries(Object.entries(e.resetAt||{}).map(([k,v])=>[k,lbTime(v)]))}}),records=[];let queried=0;
    const eligible=players.filter(p=>!p.disabled&&!p.excluded);
    for(let i=0;i<eligible.length;i+=8){const groups=await Promise.all(eligible.slice(i,i+8).map(p=>db.collection('players/'+p.uid+'/leaderboardRecords').get()));queried+=groups.length;for(const group of groups)for(const d of group.docs){const r=d.data();records.push({...r,id:d.id,achievedAt:lbTime(r.achievedAt)||null,recordedAt:lbTime(r.recordedAt)})}}
    lbAssertOwner();if(tab!=='leaderboard')return;
    const now=players.reduce((n,p)=>Object.values(p.resetAt).reduce((a,v)=>Math.max(a,v),n),records.reduce((n,r)=>Math.max(n,r.recordedAt),Date.now())),result=FSLeaderboard.calculate({players,records,config:{enabled:config.enabled===true,startsAt:lbTime(config.startsAt)}},now);
    LB_ADMIN.preview={config,result,records,players};$('#lbPublish').disabled=false;$('#lbStatus').textContent=`預覽完成：${players.length} 位玩家，${queried} 位合格玩家的成績歷史，共 ${records.length} 筆紀錄。發布前可查看六個榜單；本次為完整歷史重算。`;
    const area=$('#lbPreviewArea');area.innerHTML='<div id="lbRankPreview"></div><h3>積分明細</h3><div id="lbPoints"></div><h3>成績歷史（最近 200 筆）</h3><div id="lbHistory"></div>';
    FSLeaderboard.render($('#lbRankPreview'),{...result,enabled:true},'total');

// Temporary: replays each publication rule condition against lbDiag/* (see firestore.rules) to name the failing one.
async function lbDiagnose(preview){
  const cs=await db.doc('leaderboardConfig/current').get(),c=cs.data()||{};
  const boards=Object.fromEntries(['total',...Object.keys(FSLeaderboard.types)].map(type=>[type,preview.result.enabled?preview.result.boards[type].map(r=>({u:r.uid,n:r.name,l:Number.isSafeInteger(r.level)?r.level:1,...(type!=='total'&&FSLeaderboard.publicValue(type,r.value)?{m:FSLeaderboard.publicValue(type,r.value)}:{})})):[]]));
  const full={schemaVersion:1,enabled:c.enabled===true,startsAt:lbTime(c.startsAt),configUpdatedAt:c.updatedAt,publishedAt:FV.serverTimestamp(),boards};
  const names={admin:'管理員身分',time:'發布時間',cfgEnabled:'開關與設定相同',cfgStarts:'起算時間與設定相同',cfgUpdated:'設定版本相同',keys:'榜單欄位',boardKeys:'六榜名稱',b_total:'幻想智多星資料',b_stroop:'變色王資料',b_memory:'記憶王資料',b_maze:'電流王資料',b_quest:'闖關王資料',b_looks:'造型王資料',full:'完整發布規則'};

  const failed=[];

  for(const [id] of tests){try{await db.doc('lbDiag/'+id).delete();}catch(e){}}

  const what=kind==='notice'?'公告（不附禮物）':kind==='box'?'🎲 隨機禮物盒 ×1（平均約值 300～350 星星糖'+(att.box.starMax||att.box.expMax?'，已調高上限':'')+'）':'🎁 '+gText(att)+'（'+gWorth(att)+'）';
  let warn='';
  if(targets&&targets.length<=30&&kind!=='notice'){try{const many=[];for(const u of targets){const s=await db.collection(`players/${u}/inbox`).where('claimed','==',false).get();
      const n=s.docs.filter(d=>{const x=d.data();return x.kind==='gift'||x.kind==='box'}).length;if(n>=10){const p=PLAYERS.find(x=>x.uid===u);many.push(`${p?p.name:u}（${n} 份）`)}}
    if(many.length)warn=`\n\n⚠ 這些玩家還有很多禮物沒領：${many.join('、')}`}catch(e){}}
  if(!confirmBox(`確定寄出？\n\n類型：${what}\n對象：${who}\n標題：${title}\n期限：${days?days+' 天內要領取':'沒有期限'}${warn}`))return;
  const base={title,body:G.body.trim(),kind,att,createdAt:FV.serverTimestamp(),expireAt:days?firebase.firestore.Timestamp.fromMillis(Date.now()+days*864e5):null};
  try{
    if(!targets){await db.collection('broadcasts').add(base);await log('送禮物',`全體玩家`,`${gIcon(kind)} ${title}・${gText(att)||'公告'}`)}
    else{const ref=db.collection('sends').doc();await ref.set({...base,targets,count:targets.length});
      for(let i=0;i<targets.length;i+=400){const b=db.batch();targets.slice(i,i+400).forEach(u=>b.set(db.doc(`players/${u}/inbox/${ref.id}`),{...base,read:false,claimed:false,sid:ref.id}));await b.commit()}
      await log('送禮物',`${targets.length} 位玩家`,`${gIcon(kind)} ${title}・${gText(att)||'公告'}・${targets.map(u=>(PLAYERS.find(p=>p.uid===u)||{}).code||u).join(',')}`)}
    toast('已寄出');GF.title='';GF.body='';bcView();
  }catch(e){toast('寄出失敗：'+(e.code||e.message))}
}
async function gList(){
  const el=$('#gList');if(!el)return;
  try{const [b,s]=await Promise.all([db.collection('broadcasts').orderBy('createdAt','desc').limit(30).get(),db.collection('sends').orderBy('createdAt','desc').limit(30).get().catch(()=>({docs:[]}))]);
    const rows=[...b.docs.map(d=>({id:d.id,all:true,...d.data()})),...s.docs.map(d=>({id:d.id,all:false,...d.data()}))].sort((x,y)=>(y.createdAt?.toMillis?.()||0)-(x.createdAt?.toMillis?.()||0));
    el.innerHTML=rows.map(x=>`<div class="mail"><div><b>${gIcon(x.kind)} ${esc(x.title)}</b> <small>${x.all?'👥 全體':'👤 '+(x.count||(x.targets||[]).length)+' 位'}</small><br>
      <small>${esc(gText(x.att)||'公告')}・${fmt(x.createdAt)}${x.expireAt?'・期限 '+fmt(x.expireAt):''}</small><div class="gst" id="gst-${x.id}"></div></div>
      <div class="row"><button class="btn" data-gs="${x.id}" data-all="${x.all}">領取狀況</button><button class="btn danger" data-gr="${x.id}" data-all="${x.all}">收回未領</button></div></div>`).join('')||'<p class="empty">還沒有寄過</p>';
    const tg=x=>x.all?PLAYERS.map(p=>p.uid):(x.targets||[]);
    el.querySelectorAll('[data-gs]').forEach(bt=>bt.onclick=async()=>{const x=rows.find(r=>r.id===bt.dataset.gs),box=$('#gst-'+x.id);box.textContent='統計中…';
      let got=0,claimed=0;for(const u of tg(x)){try{const d=await db.doc(`players/${u}/inbox/${x.id}`).get();if(d.exists){got++;if(d.data().claimed)claimed++}}catch(e){}}
      box.innerHTML=`<small>收到 <b>${got}</b> 人・已領取 <b>${claimed}</b> 人${x.all?'（全體信要玩家登入後才會收到）':''}</small>`});
    el.querySelectorAll('[data-gr]').forEach(bt=>bt.onclick=async()=>{const x=rows.find(r=>r.id===bt.dataset.gr);
      if(!confirmBox(`收回「${x.title}」？\n還沒領的玩家會收不到；已經領走的不受影響。${x.all?'\n之後登入的玩家也不會再收到。':''}`))return;
      let n=0;try{if(x.all)await db.doc('broadcasts/'+x.id).delete();
        for(const u of tg(x)){try{const r=db.doc(`players/${u}/inbox/${x.id}`),d=await r.get();if(d.exists&&!d.data().claimed){await r.delete();n++}}catch(e){}}
        if(!x.all)await db.doc('sends/'+x.id).update({recalled:true}).catch(()=>{});
        await log('收回禮物',x.all?'全體玩家':`${tg(x).length} 位玩家`,`${x.title}・收回 ${n} 份`);toast(`已收回 ${n} 份`);bcView()}catch(e){toast('收回失敗：'+(e.code||e.message))}});
  }catch(e){el.innerHTML=`<p class="empty">讀取失敗：${esc(e.code||e.message)}</p>`}
}

/* ---------- 操作紀錄 ---------- */
async function logView(){
  const m=$('#main');m.innerHTML=`<div class="card"><h2>操作紀錄（最近 200 筆）</h2><div class="tablewrap" id="lg">讀取中…</div></div>`;
  let s;try{s=await db.collection('adminlog').orderBy('at','desc').limit(200).get();}catch(e){if(tab==='log')$('#lg').innerHTML=`<p class="empty">讀取失敗：${esc(e.code||e.message)}</p>`;return;}
  if(tab!=='log')return;
  $('#lg').innerHTML=`<table><thead><tr><th>時間</th><th>動作</th><th>對象</th><th>內容</th><th>管理員</th></tr></thead><tbody>${s.docs.map(d=>{const x=d.data();return `<tr><td>${fmt(x.at)}</td><td>${esc(x.action)}</td><td>${esc(x.target)}</td><td style="white-space:normal">${esc(x.detail)}</td><td>${esc(x.admin)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">還沒有紀錄</td></tr>'}</tbody></table>`;
}
})();
</script>
